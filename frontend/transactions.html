<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Transaction History - Shatova</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/transactions.css">
  <link rel="stylesheet" href="/css/theme.css">

  <!-- ============================================================
       FINAL OVERRIDE — loaded AFTER all imports so it always wins.
       1) Kills hidden/ugly element bleeding behind the list.
       2) Applies the slim, modern, day-by-day history look
          (tighter padding, softer borders, lighter shadows,
           thinner text weights, subtler transitions).
       ============================================================ -->
  <style>
    /* ---------- 1. Neutralize stray global overlays ---------- */
    html, body {
      background: var(--tx-bg, #f4f5f7);
      overflow-x: hidden;
    }

    body.tx-page { overflow-x: hidden; position: relative; }

    body.tx-page > *:not(#app-header):not(.tx-app):not(.tx-filter-fab):not(.filter-backdrop):not(.txm-backdrop):not(script):not(style) {
      display: none !important;
    }

    body.tx-page::before,
    body.tx-page::after,
    .tx-app::before,
    .tx-app::after {
      display: none !important;
      content: none !important;
    }

    #app-header { position: relative; z-index: 5; }
    .tx-app      { position: relative; z-index: 1; }

    .tx-list-section,
    #txReal,
    #txSkeleton,
    #txEmpty,
    #txPagination {
      position: relative;
      z-index: 2;
    }

    /* ---------- 2. Slim modern typography & spacing ---------- */

    /* App shell: slimmer bottom space, tighter page feel */
    .tx-app {
      padding: 0 0 92px !important;
      max-width: 480px !important;
    }

    /* Header — slimmer, lighter weight, tighter padding */
    .tx-header {
      top: 46px !important;
      padding: 11px 16px !important;
      box-shadow: none !important;
      border-bottom: 1px solid #eceef0 !important;
    }

    .tx-header-icon { width: 22px !important; height: 22px !important; }
    .tx-header-icon svg { width: 18px !important; height: 18px !important; }

    .tx-header-title {
      font-size: 15px !important;
      font-weight: 500 !important;
      letter-spacing: -0.2px !important;
      color: #1f2329 !important;
    }

    .tx-header-count {
      min-width: 22px !important;
      height: 18px !important;
      padding: 0 6px !important;
      font-size: 10.5px !important;
      font-weight: 500 !important;
      background: #eef0f3 !important;
      color: #4b5563 !important;
    }

    .tx-header-close {
      width: 30px !important;
      height: 30px !important;
      background: #f4f5f6 !important;
    }

    .tx-header-close svg { width: 13px !important; height: 13px !important; }

    /* Toolbar / dropdown — slimmer */
    .tx-toolbar {
      padding: 9px 16px 6px !important;
      background: #fff !important;
    }

    .tx-dropdown {
      min-height: 32px !important;
      padding: 6px 11px !important;
      gap: 7px !important;
      font-size: 11.5px !important;
      font-weight: 500 !important;
      border-radius: 9px !important;
      border: 1px solid #e3e5e8 !important;
      box-shadow: none !important;
      color: #3a3f47 !important;
      letter-spacing: -0.1px !important;
    }

    .tx-dropdown svg { width: 12px !important; height: 12px !important; }
    .tx-dropdown-funnel { width: 11px !important; height: 11px !important; }

    .tx-dropdown:hover {
      background: #fafafa !important;
      border-color: #cfd3d8 !important;
      color: #17191c !important;
      box-shadow: none !important;
    }

    /* Search — slimmer */
    .tx-searchbar {
      height: 40px !important;
      min-height: 40px !important;
      margin: 2px 16px 10px !important;
      padding: 0 12px !important;
      border-radius: 10px !important;
      background: #f5f6f7 !important;
      border: 1px solid #e7e9ec !important;
      box-shadow: none !important;
      gap: 8px !important;
    }

    .tx-searchbar:focus-within {
      background: #fff !important;
      border-color: #c7ccd2 !important;
      box-shadow: 0 0 0 3px rgba(31, 35, 40, 0.05) !important;
    }

    .tx-searchbar-ico { width: 15px !important; height: 15px !important; color: #9aa0a6 !important; }

    .tx-searchbar-input {
      font-size: 12px !important;
      font-weight: 400 !important;
      color: #1f2329 !important;
    }

    .tx-searchbar-input::placeholder { color: #9aa0a6 !important; font-weight: 400 !important; }

    .tx-searchbar-clear { width: 18px !important; height: 18px !important; }
    .tx-searchbar-clear svg { width: 10px !important; height: 10px !important; }

    /* Status chips — slimmer */
    .tx-chips {
      gap: 6px !important;
      padding: 0 16px 10px !important;
    }

    .tx-chip {
      min-height: 30px !important;
      padding: 5px 11px !important;
      gap: 6px !important;
      font-size: 11px !important;
      font-weight: 450 !important;
      border-radius: 8px !important;
      border: 1px solid #e5e7ea !important;
      color: #5f646d !important;
      box-shadow: none !important;
      letter-spacing: 0 !important;
    }

    .tx-chip:hover {
      background: #f8f9fa !important;
      border-color: #d3d7dc !important;
      transform: none !important;
      box-shadow: none !important;
    }

    .tx-chip.active {
      background: #1f2329 !important;
      border-color: #1f2329 !important;
      color: #fff !important;
      box-shadow: 0 1px 3px rgba(17, 24, 39, 0.14) !important;
    }

    .tx-chip-dot { width: 5px !important; height: 5px !important; }

    /* ---------- 3. Transaction list — slim day-by-day look ---------- */

    .tx-list-section {
      margin: 4px 12px 0 !important;
      gap: 6px !important;
      display: flex !important;
      flex-direction: column !important;
    }

    .tx-item {
      padding: 11px 13px !important;
      border-radius: 11px !important;
      border: 1px solid #eceef0 !important;
      background: #fff !important;
      box-shadow:
        0 1px 2px rgba(16, 24, 40, 0.02),
        0 2px 6px -2px rgba(16, 24, 40, 0.035) !important;
      transition:
        transform 0.18s cubic-bezier(0.16, 1, 0.3, 1),
        box-shadow 0.2s ease,
        border-color 0.18s ease,
        background 0.15s ease !important;
      gap: 0 !important;
    }

    .tx-item:hover {
      border-color: #d7dbe0 !important;
      transform: translateY(-1px) !important;
      box-shadow:
        0 2px 4px rgba(16, 24, 40, 0.03),
        0 6px 14px -6px rgba(16, 24, 40, 0.07) !important;
    }

    .tx-item:active {
      transform: translateY(0) scale(0.995) !important;
      background: #fafbfc !important;
    }

    .tx-item:last-child { border-bottom: 1px solid #eceef0 !important; }

    /* Text — much thinner, tighter */
    .tx-title {
      font-size: 12.5px !important;
      font-weight: 500 !important;
      letter-spacing: -0.08px !important;
      color: #1f2329 !important;
      margin-bottom: 3px !important;
      line-height: 1.28 !important;
    }

    .tx-meta { gap: 6px !important; line-height: 1.3 !important; }
    .tx-when { font-size: 10.5px !important; font-weight: 400 !important; color: #8b9098 !important; }

    .tx-pill {
      padding: 2px 7px !important;
      font-size: 8px !important;
      font-weight: 500 !important;
      letter-spacing: 0.25px !important;
      border-radius: 999px !important;
    }

    .tx-amount {
      font-size: 12.5px !important;
      font-weight: 500 !important;
      letter-spacing: -0.2px !important;
      color: #1f2329 !important;
    }

    .tx-main { padding-right: 10px !important; }

    /* Empty state — slim */
    .tx-empty {
      padding: 44px 20px !important;
      border-radius: 12px !important;
      border: 1px solid #eceef0 !important;
      box-shadow: 0 1px 3px rgba(16, 24, 40, 0.025) !important;
      margin: 6px 0 !important;
    }

    .tx-empty-emoji { font-size: 34px !important; margin-bottom: 10px !important; }
    .tx-empty-title { font-size: 13px !important; font-weight: 500 !important; color: #1f2329 !important; margin-bottom: 4px !important; }
    .tx-empty-text  { font-size: 11.5px !important; color: #8b9098 !important; line-height: 1.5 !important; }

    /* Pagination — slim */
    .tx-pagination { gap: 5px !important; padding: 16px 16px 6px !important; }

    .pg-btn,
    .pg-num {
      width: 30px !important;
      min-width: 30px !important;
      height: 30px !important;
      border-radius: 8px !important;
      border: 1px solid #e5e7ea !important;
      background: #fff !important;
      color: #5f646d !important;
      font-size: 11.5px !important;
      font-weight: 500 !important;
      box-shadow: none !important;
      transition: all 0.16s cubic-bezier(0.16, 1, 0.3, 1) !important;
    }

    .pg-btn svg { width: 13px !important; height: 13px !important; }

    .pg-btn:hover:not(:disabled),
    .pg-num:hover {
      background: #f5f6f7 !important;
      border-color: #cfd3d8 !important;
      color: #1f2329 !important;
      transform: none !important;
    }

    .pg-num.active {
      background: #1f2329 !important;
      border-color: #1f2329 !important;
      color: #fff !important;
      box-shadow: 0 1px 3px rgba(17, 24, 39, 0.14) !important;
    }

    .pg-ellipsis { font-size: 11.5px !important; font-weight: 500 !important; padding: 0 2px !important; }

    /* ---------- 4. FAB — slim ---------- */
    .tx-filter-fab {
      min-height: 38px !important;
      padding: 9px 15px !important;
      gap: 7px !important;
      border-radius: 11px !important;
      font-size: 11.5px !important;
      font-weight: 500 !important;
      letter-spacing: -0.05px !important;
      background: #1f2329 !important;
      box-shadow:
        0 4px 14px rgba(17, 24, 39, 0.16),
        0 1px 3px rgba(17, 24, 39, 0.08) !important;
      bottom: 22px !important;
      right: 16px !important;
    }

    .tx-filter-fab svg { width: 13px !important; height: 13px !important; }

    .tx-filter-fab:hover {
      background: #111214 !important;
      transform: translateY(-1px) !important;
      box-shadow:
        0 6px 18px rgba(17, 24, 39, 0.20),
        0 2px 5px rgba(17, 24, 39, 0.10) !important;
    }

    .tx-filter-badge {
      min-width: 16px !important;
      height: 16px !important;
      font-size: 9px !important;
      font-weight: 600 !important;
      border-width: 1.5px !important;
    }

    /* ---------- 5. Filter sheet — slim, premium ---------- */
    .filter-sheet {
      border-radius: 18px 18px 0 0 !important;
      padding: 6px 15px calc(12px + env(safe-area-inset-bottom, 0px)) !important;
      box-shadow: 0 -10px 34px rgba(20, 24, 22, 0.12) !important;
    }

    .filter-grip { width: 30px !important; height: 3px !important; margin: 4px auto 9px !important; }

    .filter-head { padding: 1px 1px 10px !important; margin-bottom: 4px !important; }
    .filter-head-icon { width: 28px !important; height: 28px !important; border-radius: 8px !important; }
    .filter-head-icon svg { width: 14px !important; height: 14px !important; }
    .filter-head-title { font-size: 13.5px !important; font-weight: 500 !important; letter-spacing: -0.15px !important; color: #1f2329 !important; }
    .filter-head-close { width: 26px !important; height: 26px !important; border-radius: 8px !important; }
    .filter-head-close svg { width: 12px !important; height: 12px !important; }

    .filter-body { gap: 6px !important; padding: 2px 0 6px !important; }

    .filter-card {
      min-height: 50px !important;
      gap: 10px !important;
      padding: 8px 10px !important;
      border-radius: 10px !important;
      border: 1px solid #e7e8ea !important;
      box-shadow: none !important;
      background: #fff !important;
    }

    .filter-card:hover {
      background: #fafafa !important;
      border-color: #d5d8dc !important;
      transform: none !important;
      box-shadow: none !important;
    }

    .filter-card.active {
      background: #f6f6f7 !important;
      border-color: #7a7e86 !important;
      box-shadow: inset 0 0 0 1px rgba(35, 37, 40, 0.03) !important;
    }

    .filter-card-icon,
    .filter-card-icon-all,
    .filter-card-icon-deposit,
    .filter-card-icon-withdraw,
    .filter-card-icon-refund,
    .filter-card-icon-transfer {
      width: 30px !important;
      height: 30px !important;
      border-radius: 8px !important;
      color: #555960 !important;
      background: #f3f3f4 !important;
      border: 1px solid #e8e8ea !important;
    }

    .filter-card-icon svg { width: 14px !important; height: 14px !important; }

    .filter-card-info { gap: 1px !important; }
    .filter-card-title { font-size: 11.5px !important; font-weight: 500 !important; line-height: 1.32 !important; color: #2a2e34 !important; letter-spacing: -0.05px !important; }
    .filter-card.active .filter-card-title { color: #1f2329 !important; }
    .filter-card-sub { font-size: 10px !important; font-weight: 400 !important; color: #8b9098 !important; line-height: 1.3 !important; }

    .filter-card-check { width: 16px !important; height: 16px !important; background: #1f2329 !important; border-color: #1f2329 !important; box-shadow: none !important; }
    .filter-card-check svg { width: 9px !important; height: 9px !important; }

    .filter-foot { gap: 7px !important; padding-top: 9px !important; margin-top: 2px !important; border-top: 1px solid #eceef0 !important; }

    .filter-btn {
      min-height: 36px !important;
      padding: 9px 12px !important;
      border-radius: 9px !important;
      font-size: 11px !important;
      font-weight: 500 !important;
      letter-spacing: 0 !important;
      box-shadow: none !important;
    }

    .filter-btn svg { width: 13px !important; height: 13px !important; }
    .filter-btn-reset { color: #454951 !important; background: #fff !important; border: 1px solid #dfe1e4 !important; }
    .filter-btn-reset:hover { background: #f6f6f7 !important; box-shadow: none !important; }
    .filter-btn-apply { color: #fff !important; background: #1f2329 !important; border: 1px solid #1f2329 !important; }
    .filter-btn-apply:hover { background: #111214 !important; border-color: #111214 !important; transform: none !important; box-shadow: none !important; }

    /* ---------- 6. Compact screens ---------- */
    @media (max-width: 380px) {
      .tx-list-section { margin: 4px 9px 0 !important; gap: 5px !important; }
      .tx-item { padding: 10px 11px !important; border-radius: 10px !important; }
      .tx-title { font-size: 12px !important; }
      .tx-amount { font-size: 12px !important; }
      .tx-pill { font-size: 7.5px !important; padding: 2px 6px !important; }
      .tx-filter-fab { right: 12px !important; bottom: calc(14px + env(safe-area-inset-bottom, 0px)) !important; }
      .filter-sheet { padding-left: 12px !important; padding-right: 12px !important; }
      .filter-card { min-height: 46px !important; padding: 7px 9px !important; gap: 9px !important; }
      .filter-card-icon,
      .filter-card-icon-all,
      .filter-card-icon-deposit,
      .filter-card-icon-withdraw,
      .filter-card-icon-refund,
      .filter-card-icon-transfer { width: 28px !important; height: 28px !important; }
      .filter-card-title { font-size: 11px !important; }
      .filter-card-sub { font-size: 9.5px !important; }
      .filter-btn { min-height: 34px !important; font-size: 10.5px !important; }
    }

    /* ---------- 7. Motion sensitivity ---------- */
    @media (prefers-reduced-motion: reduce) {
      .tx-item, .tx-chip, .pg-btn, .pg-num, .filter-card, .filter-btn, .tx-filter-fab {
        transition-duration: 0.01ms !important;
      }
    }

    /* ============================================================
       SHATOVA PRO LAYOUT — FIXED CONTROLS / SCROLLABLE HISTORY
       ============================================================ */
    :root {
      --tx-brand: #0a4534;
      --tx-brand-dark: #073326;
      --tx-brand-soft: #eaf3ef;
      --tx-ink: #18231f;
      --tx-muted: #7b8580;
      --tx-line: #e5eae7;
      --tx-canvas: #f5f7f6;
    }

    html, body {
      width: 100%;
      height: 100%;
      min-height: 0;
      overflow: hidden !important;
      overscroll-behavior: none;
      background: var(--tx-canvas) !important;
    }

    body.tx-page {
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden !important;
    }

    #app-header {
      flex: 0 0 auto;
      z-index: 20;
    }

    .tx-app {
      width: 100% !important;
      max-width: 760px !important;
      height: calc(100vh - 46px);
      height: calc(100dvh - 46px);
      min-height: 0 !important;
      margin: 0 auto !important;
      padding: 0 0 8px !important;
      display: flex !important;
      flex-direction: column !important;
      overflow: hidden !important;
      position: relative !important;
      background: var(--tx-canvas);
      gap: 0 !important;
    }

    .tx-header {
      position: relative !important;
      top: auto !important;
      flex: 0 0 auto;
      z-index: 10 !important;
      min-height: 49px;
      padding: 10px 18px !important;
      background: #fff !important;
      border-bottom: 1px solid var(--tx-line) !important;
      box-shadow: 0 2px 8px rgba(13, 45, 32, .025) !important;
    }

    .tx-toolbar {
      flex: 0 0 auto;
      padding: 9px 18px 4px !important;
      background: #fff !important;
    }

    .tx-searchbar {
      flex: 0 0 auto;
      margin: 4px 18px 9px !important;
      width: auto !important;
      min-width: 0;
    }

    .tx-date-filter {
      flex: 0 0 auto;
      margin: 0 18px 9px;
      padding: 10px 12px 8px;
      background: #fff;
      border: 1px solid var(--tx-line);
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(14, 39, 29, .025);
    }

    .tx-date-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }

    .tx-date-heading > div {
      display: flex;
      align-items: baseline;
      gap: 8px;
      min-width: 0;
    }

    .tx-date-eyebrow {
      color: var(--tx-brand);
      font-size: 9px;
      line-height: 1.2;
      font-weight: 800;
      letter-spacing: .9px;
    }

    .tx-date-title {
      color: #27332d;
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: -.15px;
    }

    .tx-date-clear {
      border: 0;
      background: transparent;
      color: var(--tx-brand);
      font: inherit;
      font-size: 10.5px;
      font-weight: 600;
      padding: 4px 0 4px 8px;
      white-space: nowrap;
      cursor: pointer;
    }

    .tx-date-fields {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 14px minmax(0, 1fr);
      align-items: end;
      gap: 7px;
    }

    .tx-date-field {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
      color: #78827c;
      font-size: 9.5px;
      font-weight: 600;
    }

    .tx-date-field input {
      width: 100%;
      min-width: 0;
      height: 34px;
      padding: 0 8px;
      color: #25332c;
      background: #f8faf9;
      border: 1px solid #e1e8e3;
      border-radius: 8px;
      outline: none;
      font: 500 11px/1 Inter, sans-serif;
      color-scheme: light;
    }

    .tx-date-field input:focus {
      border-color: #6d9b86;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(10, 69, 52, .07);
    }

    .tx-date-arrow {
      align-self: center;
      margin-top: 14px;
      color: #a3ada7;
      font-size: 12px;
      text-align: center;
    }

    .tx-date-message {
      margin: 6px 1px 0;
      min-height: 12px;
      color: #87918b;
      font-size: 9.5px;
      line-height: 1.3;
    }

    .tx-chips {
      flex: 0 0 auto;
      padding: 0 18px 9px !important;
      background: #fff;
      border-bottom: 1px solid var(--tx-line);
      overflow-x: auto;
      flex-wrap: nowrap !important;
      scrollbar-width: none;
    }
    .tx-chips::-webkit-scrollbar { display: none; }

    .tx-list-section {
      flex: 1 1 auto !important;
      min-height: 0 !important;
      margin: 0 !important;
      padding: 9px 12px 0 !important;
      display: flex !important;
      flex-direction: column !important;
      gap: 0 !important;
      overflow: hidden !important;
    }

    #txSkeleton, #txReal, #txEmpty {
      min-height: 0 !important;
      width: 100%;
    }

    #txSkeleton {
      flex: 1 1 auto;
      overflow: hidden;
    }

    #txReal {
      flex: 1 1 auto !important;
      min-height: 0 !important;
      overflow-y: auto !important;
      overflow-x: hidden !important;
      overscroll-behavior-y: contain;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
      scrollbar-color: #cbd8d0 transparent;
      padding: 0 1px 12px;
      align-content: start;
    }

    #txReal::-webkit-scrollbar { width: 4px; }
    #txReal::-webkit-scrollbar-track { background: transparent; }
    #txReal::-webkit-scrollbar-thumb {
      background: #cbd8d0;
      border-radius: 20px;
    }

    .tx-list-section .tx-empty {
      flex: 1 1 auto;
      overflow-y: auto;
    }

    .tx-pagination {
      flex: 0 0 auto;
      padding: 8px 16px calc(8px + env(safe-area-inset-bottom, 0px)) !important;
      background: #fff;
      border-top: 1px solid var(--tx-line);
    }

    .tx-filter-fab {
      z-index: 30 !important;
      bottom: calc(18px + env(safe-area-inset-bottom, 0px)) !important;
    }

    .filter-backdrop, .txm-backdrop { z-index: 100 !important; }

    @media (min-width: 700px) {
      .tx-app {
        max-width: 900px !important;
        border-left: 1px solid #edf0ee;
        border-right: 1px solid #edf0ee;
        box-shadow: 0 0 30px rgba(16, 44, 31, .035);
      }
      .tx-header { padding-left: 24px !important; padding-right: 24px !important; }
      .tx-toolbar { padding-left: 24px !important; padding-right: 24px !important; }
      .tx-searchbar { margin-left: 24px !important; margin-right: 24px !important; }

  <!-- ═══════════ SCRIPTS — order matters ═══════════ -->
  <script src="/js/auth-guard.js"></script>

  <script type="module" src="/js/transactions.js"></script>
  <script>
    (function () {
      const fromInput = document.getElementById('txDateFrom');
      const toInput = document.getElementById('txDateTo');
      const clearButton = document.getElementById('txDateClear');
      const message = document.getElementById('txDateMessage');
      const list = document.getElementById('txReal');
      if (!fromInput || !toInput || !list) return;

      const originalDisplay = new WeakMap();
      let observer;

      function parseTransactionDate(item) {
        const explicit = item.dataset.date || item.dataset.createdAt ||
          item.getAttribute('datetime') || '';
        if (explicit) {
          const d = new Date(explicit);
          if (!Number.isNaN(d.getTime())) return d;
        }

        const dateNode = item.querySelector('.tx-when, time, [data-date]');
        if (dateNode) {
          const raw = dateNode.getAttribute('datetime') ||
            dateNode.dataset.date || dateNode.textContent.trim();
          const parsed = new Date(raw);
          if (!Number.isNaN(parsed.getTime())) return parsed;
        }

        // Last-resort fallback: find a date-like string in the transaction card.
        const text = item.innerText || item.textContent || '';
        const match = text.match(/\b(?:\d{4}-\d{1,2}-\d{1,2}|\d{1,2}[\/.-]\d{1,2}[\/.-]\d{2,4}|(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\s+\d{1,2},?\s+\d{4})\b/i);
        if (match) {
          const parsed = new Date(match[0]);
          if (!Number.isNaN(parsed.getTime())) return parsed;
        }
        return null;
      }

      function localDateValue(date) {
        return date.getFullYear() + '-' +
          String(date.getMonth() + 1).padStart(2, '0') + '-' +
          String(date.getDate()).padStart(2, '0');
      }

      function applyDateFilter() {
        const from = fromInput.value;
        const to = toInput.value;

        if (from && to && from > to) {
          toInput.setCustomValidity('End date must be on or after the start date.');
          toInput.reportValidity();
          message.textContent = 'Please choose an end date on or after the start date.';
          return;
        }
        toInput.setCustomValidity('');

        const cards = Array.from(list.children).filter(el =>
          el.classList.contains('tx-item') || el.hasAttribute('data-transaction')
        );
        let shown = 0;
        let unrecognized = 0;

        cards.forEach(card => {
          if (!originalDisplay.has(card)) originalDisplay.set(card, card.style.display);
          const date = parseTransactionDate(card);
          let visible = true;

          if ((from || to) && !date) {
            visible = false;
            unrecognized++;
          } else if (date) {
            const value = localDateValue(date);
            if (from && value < from) visible = false;
            if (to && value > to) visible = false;
          }

          card.style.display = visible ? (originalDisplay.get(card) || '') : 'none';
          if (visible) shown++;
        });

        if (!from && !to) {
          message.textContent = 'Showing all dates';
        } else {
          const range = (from || 'Earliest') + ' – ' + (to || 'Latest');
          message.textContent = shown + ' transaction' + (shown === 1 ? '' : 's') +
            ' in ' + range + (unrecognized ? ' · Some dates could not be read' : '');
        }

        const empty = document.getElementById('txEmpty');
        if (cards.length && shown === 0 && (from || to) && empty) {
          const title = document.getElementById('txEmptyTitle');
          const text = document.getElementById('txEmptyText');
          if (title) title.textContent = 'No transactions for this period';
          if (text) text.textContent = 'Try a different date range or clear the dates.';
        }
      }

      fromInput.addEventListener('change', applyDateFilter);
      toInput.addEventListener('change', applyDateFilter);

      clearButton.addEventListener('click', function () {
        fromInput.value = '';
        toInput.value = '';
        toInput.setCustomValidity('');
        applyDateFilter();
      });

      observer = new MutationObserver(() => applyDateFilter());
      observer.observe(list, { childList: true, subtree: false });
      window.addEventListener('pageshow', applyDateFilter);
      window.addEventListener('resize', () => {
        document.body.style.setProperty('overflow', 'hidden', 'important');
      });
      applyDateFilter();
    })();
  </script>

  <script>
    /* SHATOVA pagination controller: supports every page, not only pages 1–5. */
    (function () {
      const list = document.getElementById('txReal');
      const pagination = document.getElementById('txPagination');
      const numbers = document.getElementById('pgNumbers');
      const prev = document.getElementById('pgPrev');
      const next = document.getElementById('pgNext');
      if (!list || !pagination || !numbers || !prev || !next) return;

      const PAGE_SIZE = 10;
      let currentPage = 1;
      let renderQueued = false;

      function transactionCards() {
        return Array.from(list.children).filter(el =>
          el.classList.contains('tx-item') || el.hasAttribute('data-transaction')
        );
      }

      function isDateEligible(card) {
        // The date filter sets inline display:none for cards outside the selected range.
        // Page hiding uses a class, so it does not interfere with this check.
        return card.dataset.dateFilteredOut !== 'true' &&
          (card.style.display !== 'none' || card.classList.contains('tx-page-hidden'));
      }

      function pageButton(label, page, active) {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'pg-num' + (active ? ' active' : '');
        button.textContent = String(label);
        button.setAttribute('aria-label', 'Page ' + page);
        if (active) button.setAttribute('aria-current', 'page');
        button.addEventListener('click', function () {
          currentPage = page;
          render();
          list.scrollTop = 0;
        });
        return button;
      }

      function ellipsis() {
        const span = document.createElement('span');
        span.className = 'pg-ellipsis';
        span.textContent = '…';
        span.setAttribute('aria-hidden', 'true');
        return span;
      }

      function render() {
        const all = transactionCards();
        // Preserve the date filter's visibility before changing page visibility.
        const eligible = all.filter(card => {
          if (card.classList.contains('tx-page-hidden')) return card.dataset.txDateEligible !== 'false';
          const eligibleNow = card.style.display !== 'none';
          card.dataset.txDateEligible = eligibleNow ? 'true' : 'false';
          return eligibleNow;
        });

        const totalPages = Math.max(1, Math.ceil(eligible.length / PAGE_SIZE));
        currentPage = Math.min(Math.max(1, currentPage), totalPages);
        const start = (currentPage - 1) * PAGE_SIZE;
        const end = start + PAGE_SIZE;

        all.forEach(card => {
          const index = eligible.indexOf(card);
          card.classList.toggle('tx-page-hidden', index < 0 || index < start || index >= end);
        });

        pagination.classList.toggle('hidden', eligible.length <= PAGE_SIZE);
        numbers.replaceChildren();
        if (totalPages <= 7) {
          for (let page = 1; page <= totalPages; page++) {
            numbers.appendChild(pageButton(page, page, page === currentPage));
          }
        } else {
          const pages = new Set([1, totalPages, currentPage, currentPage - 1, currentPage + 1]);
          if (currentPage <= 3) [2, 3, 4].forEach(p => pages.add(p));
          if (currentPage >= totalPages - 2) [totalPages - 3, totalPages - 2, totalPages - 1].forEach(p => pages.add(p));
          let last = 0;
          Array.from(pages).filter(p => p >= 1 && p <= totalPages).sort((a,b) => a-b).forEach(page => {
            if (last && page - last > 1) numbers.appendChild(ellipsis());
            numbers.appendChild(pageButton(page, page, page === currentPage));
            last = page;
          });
        }
        prev.disabled = currentPage <= 1;
        next.disabled = currentPage >= totalPages;
        prev.onclick = function () { if (currentPage > 1) { currentPage--; render(); list.scrollTop = 0; } };
        next.onclick = function () { if (currentPage < totalPages) { currentPage++; render(); list.scrollTop = 0; } };
      }

      function scheduleRender(reset) {
        if (reset) currentPage = 1;
        if (renderQueued) return;
        renderQueued = true;
        requestAnimationFrame(function () {
          renderQueued = false;
          render();
        });
      }

      const observer = new MutationObserver(() => scheduleRender(true));
      observer.observe(list, { childList: true });
      document.getElementById('txDateFrom')?.addEventListener('change', () => scheduleRender(true));
      document.getElementById('txDateTo')?.addEventListener('change', () => scheduleRender(true));
      document.getElementById('txDateClear')?.addEventListener('click', () => scheduleRender(true));
      document.getElementById('txStatusChips')?.addEventListener('click', () => scheduleRender(true));
      document.getElementById('txSearchInput')?.addEventListener('input', () => scheduleRender(true));
      window.addEventListener('pageshow', () => scheduleRender(true));
      scheduleRender(true);
    })();
  </script>

</body>
