<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>PIN - Shatova</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<link rel="stylesheet" href="/css/pin.css">
</head>
<body class="pin-page">

<main class="pin-wrap">

  <!-- LOCK ICON -->
  <div class="pin-lock" id="pinLock">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="11" width="16" height="10" rx="2"/>
      <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
    </svg>
  </div>

  <!-- TITLE -->
  <h1 class="pin-title" id="pinTitle">Enter PIN</h1>
  <p class="pin-subtitle" id="pinSubtitle">Unlock to continue</p>

  <!-- DOTS -->
  <div class="pin-dots" id="pinDots">
    <span class="pin-dot"></span>
    <span class="pin-dot"></span>
    <span class="pin-dot"></span>
    <span class="pin-dot"></span>
  </div>

  <!-- ERROR -->
  <div class="pin-error" id="pinError"></div>

  <!-- FINGERPRINT (verify mode only) -->
  <button class="pin-bio" id="pinBio" type="button" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 11v3a3 3 0 0 1-6 0"/>
      <path d="M9 11V8a3 3 0 0 1 6 0v6a3 3 0 0 1-.3 1.3"/>
      <path d="M15 15.5a6 6 0 0 0 .5 3"/>
      <path d="M6 18a6 6 0 0 1-1-6 7 7 0 0 1 3-5.5"/>
      <path d="M18 8.5a6 6 0 0 1 1 3.5v1"/>
    </svg>
    <span>Use Fingerprint</span>
  </button>

  <!-- KEYPAD -->
  <div class="pin-pad" id="pinPad">
    <button class="pin-key" data-key="1">1</button>
    <button class="pin-key" data-key="2">2</button>
    <button class="pin-key" data-key="3">3</button>
    <button class="pin-key" data-key="4">4</button>
    <button class="pin-key" data-key="5">5</button>
    <button class="pin-key" data-key="6">6</button>
    <button class="pin-key" data-key="7">7</button>
    <button class="pin-key" data-key="8">8</button>
    <button class="pin-key" data-key="9">9</button>
    <button class="pin-key pin-key-text" data-key="clear">Clear</button>
    <button class="pin-key" data-key="0">0</button>
    <button class="pin-key pin-key-icon" data-key="back" aria-label="Backspace">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"/>
        <line x1="18" y1="9" x2="12" y2="15"/>
        <line x1="12" y1="9" x2="18" y2="15"/>
      </svg>
    </button>
  </div>

  <!-- BOTTOM BUTTON -->
  <button class="pin-bottom" id="pinBottom">Log Out</button>

</main>

<script src="/js/pin.js"></script>
<script src="/js/api.js"></script>
</body>
</html>
