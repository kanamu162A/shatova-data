<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Shatova - Electricity</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/home.css">
  <link rel="stylesheet" href="/css/menu.css">

  <style>
    /* ============================================================
       ELECTRICITY — page styles (DataShop-flow parity)
       Namespaced .elx- to avoid collision.
       ============================================================ */
    :root {
      --elx-blue:       #2563eb;
      --elx-blue-dk:    #1d4ed8;
      --elx-blue-soft:  #eff6ff;
      --elx-green:      #16a34a;
      --elx-green-dk:   #15803d;
      --elx-green-soft: #ecfdf5;
      --elx-green-line: #86efac;
      --elx-red:        #dc2626;
      --elx-red-soft:   #fef2f2;
      --elx-red-line:   #fecaca;
      --elx-amber:      #d97706;
      --elx-amber-soft: #fffbeb;
      --elx-amber-line: #fde68a;
      --elx-ink:        #0f172a;
      --elx-ink-2:      #334155;
      --elx-muted:      #64748b;
      --elx-muted-2:    #94a3b8;
      --elx-line:       #e8ecf1;
      --elx-line-2:     #eef2f6;
      --elx-bg:         #f7f9fc;
      --elx-card:       #ffffff;
      --elx-shadow:     0 1px 2px rgba(15,23,42,.04), 0 4px 14px rgba(15,23,42,.04);
      --elx-shadow-lg:  0 4px 20px rgba(15,23,42,.08);
    }

    body.elx-body {
      background: var(--elx-bg);
      color: var(--elx-ink);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0; padding: 0;
      -webkit-tap-highlight-color: transparent;
      min-height: 100vh;
    }

    .elx-wrap {
      max-width: 520px;
      margin: 0 auto;
      padding: 8px 16px 140px;
    }

    /* ============================================================
       PAGE HEADER — back arrow + service label + title + icon
       ============================================================ */
    .elx-hdr {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 0 22px;
      position: sticky;
      top: 0;
      background: linear-gradient(180deg, var(--elx-bg) 0%, var(--elx-bg) 78%, transparent 100%);
      z-index: 5;
    }
    .elx-hdr-back {
      width: 42px; height: 42px;
      border-radius: 12px;
      background: #fff;
      border: 1px solid var(--elx-line);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform .12s, border-color .15s;
      box-shadow: 0 1px 2px rgba(15,23,42,.04);
    }
    .elx-hdr-back:active { transform: scale(.94); }
    .elx-hdr-back svg { width: 18px; height: 18px; color: var(--elx-ink); }

    .elx-hdr-info { flex: 1; min-width: 0; }
    .elx-hdr-info .eyebrow {
      font-size: 10.5px;
      color: var(--elx-muted-2);
      text-transform: uppercase;
      letter-spacing: .12em;
      font-weight: 800;
      margin-bottom: 3px;
    }
    .elx-hdr-info .title {
      font-size: 18px;
      font-weight: 800;
      color: var(--elx-ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: -.01em;
    }

    .elx-hdr-icon {
      width: 42px; height: 42px;
      border-radius: 12px;
      background: var(--elx-green);
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(22,163,74,.28);
    }
    .elx-hdr-icon svg { width: 22px; height: 22px; }

    /* ============================================================
       CARDS
       ============================================================ */
    .elx-card {
      background: var(--elx-card);
      border: 1px solid var(--elx-line);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 14px;
      box-shadow: var(--elx-shadow);
    }
    .elx-card.tight { padding: 14px; }

    .elx-label {
      font-size: 11px;
      color: var(--elx-muted-2);
      text-transform: uppercase;
      letter-spacing: .1em;
      font-weight: 800;
      margin-bottom: 12px;
    }

    /* ============================================================
       ROW LIST — discos
       ============================================================ */
    .elx-list { display: flex; flex-direction: column; gap: 10px; }

    .elx-row {
      display: flex;
      align-items: center;
      gap: 14px;
      background: #fff;
      border: 1px solid var(--elx-line);
      border-radius: 16px;
      padding: 14px 16px;
      cursor: pointer;
      transition: transform .12s, border-color .15s;
      box-shadow: var(--elx-shadow);
      -webkit-user-select: none; user-select: none;
    }
    .elx-row:active { transform: scale(.985); border-color: var(--elx-green); }

    .elx-logo {
      width: 46px; height: 46px;
      border-radius: 12px;
      background: #f1f5f9;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
      border: 1px solid var(--elx-line-2);
    }
    .elx-logo img {
      width: 100%; height: 100%;
      object-fit: contain;
      padding: 5px;
      background: #fff;
    }
    .elx-logo .ini {
      font-weight: 800;
      font-size: 13px;
      color: #1e40af;
      letter-spacing: .4px;
      background: linear-gradient(135deg, #e0f2fe 0%, #dbeafe 100%);
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
    }

    .elx-info { flex: 1; min-width: 0; }
    .elx-info .name {
      font-size: 14px;
      font-weight: 800;
      color: var(--elx-ink);
      margin-bottom: 3px;
      letter-spacing: -.005em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .elx-info .meta {
      font-size: 12px;
      color: var(--elx-muted);
      font-weight: 500;
    }
    .elx-chev {
      width: 20px; height: 20px;
      color: var(--elx-muted-2);
      flex-shrink: 0;
      transition: color .15s, transform .15s;
    }
    .elx-row:active .elx-chev { color: var(--elx-green); transform: translateX(2px); }

    /* ============================================================
       PRODUCT CARDS — for a selected disco
       ============================================================ */
    .elx-prod {
      background: #fff;
      border: 1px solid var(--elx-line);
      border-radius: 16px;
      padding: 16px;
      cursor: pointer;
      transition: transform .12s, border-color .15s, box-shadow .15s;
      box-shadow: var(--elx-shadow);
      -webkit-user-select: none; user-select: none;
    }
    .elx-prod:active { transform: scale(.985); border-color: var(--elx-green); }

    .elx-prod-top {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      margin-bottom: 12px;
    }
    .elx-prod-top .elx-logo { width: 42px; height: 42px; }

    .elx-prod-name { flex: 1; min-width: 0; }
    .elx-prod-name .n {
      font-size: 14px;
      font-weight: 800;
      color: var(--elx-ink);
      margin-bottom: 3px;
      letter-spacing: -.005em;
    }
    .elx-prod-name .p {
      font-size: 11.5px;
      color: var(--elx-muted);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    .elx-prod-name .tag {
      display: inline-block;
      font-size: 10.5px;
      font-weight: 800;
      color: var(--elx-green);
      background: var(--elx-green-soft);
      border: 1px solid var(--elx-green-line);
      padding: 3px 9px;
      border-radius: 6px;
      margin-top: 6px;
      letter-spacing: .02em;
    }

    .elx-prod-desc {
      font-size: 12px;
      color: var(--elx-muted);
      font-weight: 500;
      margin-bottom: 14px;
      line-height: 1.5;
    }
    .elx-prod-foot {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .elx-prod-status {
      font-size: 11.5px;
      font-weight: 700;
      color: var(--elx-green);
      text-transform: uppercase;
      letter-spacing: .06em;
    }
    .elx-prod-buy {
      background: var(--elx-blue);
      color: #fff;
      border: 0;
      padding: 9px 20px;
      border-radius: 10px;
      font-size: 12.5px;
      font-weight: 800;
      cursor: pointer;
      font-family: inherit;
      letter-spacing: .02em;
      transition: transform .12s, background .15s;
      box-shadow: 0 2px 8px rgba(37,99,235,.25);
    }
    .elx-prod-buy:active { transform: scale(.96); }

    /* ============================================================
       INPUTS
       ============================================================ */
    .elx-input {
      width: 100%;
      background: #fff;
      border: 1.5px solid var(--elx-line);
      color: var(--elx-ink);
      padding: 16px 15px;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
      font-family: inherit;
      font-weight: 600;
      transition: border-color .15s, box-shadow .15s;
      box-sizing: border-box;
      letter-spacing: .01em;
    }
    .elx-input::placeholder { color: var(--elx-muted-2); font-weight: 500; letter-spacing: 0; }
    .elx-input:focus {
      border-color: var(--elx-blue);
      box-shadow: 0 0 0 4px rgba(37,99,235,.11);
    }
    .elx-input:disabled {
      background: #f8fafc;
      color: var(--elx-muted);
      cursor: not-allowed;
    }

    .elx-input-row {
      display: flex;
      gap: 8px;
      align-items: stretch;
    }
    .elx-input-row .elx-input { flex: 1; }

    .elx-pick-btn {
      padding: 0 18px;
      border: 1.5px solid var(--elx-line);
      border-radius: 12px;
      background: #fff;
      color: var(--elx-ink);
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      transition: border-color .15s, background .15s;
      display: flex; align-items: center; gap: 6px;
      white-space: nowrap;
      font-family: inherit;
    }
    .elx-pick-btn:active { transform: scale(.97); }
    .elx-pick-btn svg { width: 14px; height: 14px; color: var(--elx-muted); }

    /* ============================================================
       BUTTONS
       ============================================================ */
    .elx-btn {
      width: 100%;
      border: 0;
      padding: 17px 16px;
      border-radius: 14px;
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
      transition: transform .12s, opacity .15s, box-shadow .15s, background .15s;
      font-family: inherit;
      display: flex; align-items: center; justify-content: center;
      gap: 8px;
      letter-spacing: .005em;
    }
    .elx-btn.blue {
      background: var(--elx-blue);
      color: #fff;
      box-shadow: 0 4px 14px rgba(37,99,235,.28);
    }
    .elx-btn.blue:hover:not(:disabled) { background: var(--elx-blue-dk); }
    .elx-btn.blue:active:not(:disabled) { transform: scale(.985); }
    .elx-btn.blue:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }

    .elx-btn.green {
      background: var(--elx-green);
      color: #fff;
      box-shadow: 0 4px 14px rgba(22,163,74,.28);
    }
    .elx-btn.green:hover:not(:disabled) { background: var(--elx-green-dk); }
    .elx-btn.green:active:not(:disabled) { transform: scale(.985); }
    .elx-btn.green:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }

    .elx-btn.ghost {
      background: #fff;
      border: 1.5px solid var(--elx-line);
      color: var(--elx-ink);
      box-shadow: var(--elx-shadow);
    }
    .elx-btn.ghost:active { transform: scale(.985); }

    /* ============================================================
       VERIFIED BANNER (green block, DataShop style)
       ============================================================ */
    .elx-verified-banner {
      background: var(--elx-green);
      color: #fff;
      border-radius: 16px;
      padding: 26px 18px;
      text-align: center;
      margin-bottom: 14px;
      box-shadow: 0 4px 20px rgba(22,163,74,.28);
      animation: elx-pop .25s ease-out;
    }
    @keyframes elx-pop {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .elx-verified-banner .vb-icon {
      width: 56px; height: 56px;
      border-radius: 50%;
      background: rgba(255,255,255,.22);
      display: inline-flex; align-items: center; justify-content: center;
      margin-bottom: 14px;
    }
    .elx-verified-banner .vb-icon svg { width: 28px; height: 28px; color: #fff; }
    .elx-verified-banner .vb-title {
      font-size: 17px;
      font-weight: 800;
      margin-bottom: 6px;
      letter-spacing: -.01em;
    }
    .elx-verified-banner .vb-sub {
      font-size: 13px;
      opacity: .92;
      font-weight: 500;
      line-height: 1.5;
    }

    /* ============================================================
       CUSTOMER DETAILS (KV rows)
       ============================================================ */
    .elx-details-label {
      font-size: 10.5px;
      color: var(--elx-muted-2);
      text-transform: uppercase;
      letter-spacing: .12em;
      font-weight: 800;
      margin: 8px 0 12px;
      padding-left: 2px;
    }

    .elx-kv {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 14px;
      padding: 14px 0;
      border-bottom: 1px solid var(--elx-line-2);
      font-size: 13.5px;
    }
    .elx-kv:last-child { border-bottom: 0; padding-bottom: 0; }
    .elx-kv:first-child { padding-top: 0; }
    .elx-kv .k {
      color: var(--elx-muted);
      font-weight: 500;
      flex-shrink: 0;
      letter-spacing: .005em;
    }
    .elx-kv .v {
      font-weight: 700;
      text-align: right;
      color: var(--elx-ink);
      word-break: break-word;
      flex: 1;
      min-width: 0;
      letter-spacing: -.005em;
    }

    /* ============================================================
       TOKEN
       ============================================================ */
    .elx-token {
      background: linear-gradient(135deg, #ecfdf5 0%, #d1fae5 100%);
      border: 1.5px dashed var(--elx-green);
      border-radius: 16px;
      padding: 24px 16px;
      margin-top: 4px;
      text-align: center;
      animation: elx-pop .3s ease-out;
    }
    .elx-token .lbl {
      font-size: 10.5px;
      font-weight: 800;
      color: #047857;
      text-transform: uppercase;
      letter-spacing: .12em;
      margin-bottom: 12px;
    }
    .elx-token .tok {
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: 21px;
      font-weight: 800;
      letter-spacing: 3px;
      color: #065f46;
      word-break: break-all;
      line-height: 1.4;
    }
    .elx-token .units {
      color: #047857;
      font-size: 12.5px;
      margin-top: 10px;
      font-weight: 700;
      letter-spacing: .02em;
    }
    .elx-copy {
      margin-top: 16px;
      background: var(--elx-green);
      border: 0;
      color: #fff;
      padding: 11px 22px;
      border-radius: 10px;
      font-size: 12.5px;
      font-weight: 800;
      cursor: pointer;
      font-family: inherit;
      transition: transform .12s, background .15s;
      letter-spacing: .02em;
      box-shadow: 0 2px 8px rgba(22,163,74,.25);
    }
    .elx-copy:active { transform: scale(.96); }

    /* ============================================================
       ALERTS
       ============================================================ */
    .elx-alert {
      padding: 13px 15px;
      border-radius: 12px;
      font-size: 13px;
      margin-top: 12px;
      font-weight: 600;
      line-height: 1.5;
      display: flex;
      align-items: flex-start;
      gap: 9px;
      letter-spacing: .002em;
    }
    .elx-alert.err  { background: var(--elx-red-soft);   border: 1px solid var(--elx-red-line);   color: #991b1b; }
    .elx-alert.warn { background: var(--elx-amber-soft); border: 1px solid var(--elx-amber-line); color: #92400e; }
    .elx-alert.ok   { background: var(--elx-green-soft); border: 1px solid var(--elx-green-line); color: #065f46; }

    /* ============================================================
       SPINNER
       ============================================================ */
    .elx-spin {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: elx-r .7s linear infinite;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .elx-alert.ok .elx-spin,
    .elx-alert.warn .elx-spin { border-color: rgba(6,95,70,.25); border-top-color: #065f46; }
    .elx-alert.err .elx-spin { border-color: rgba(153,27,27,.3); border-top-color: #991b1b; }
    @keyframes elx-r { to { transform: rotate(360deg); } }

    /* ============================================================
       SKELETON
       ============================================================ */
    .elx-skel {
      background: linear-gradient(90deg, #f1f5f9 0%, #e2e8f0 50%, #f1f5f9 100%);
      background-size: 200% 100%;
      animation: elx-shim 1.4s infinite;
      border-radius: 8px;
    }
    @keyframes elx-shim {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* ============================================================
       RECEIPT HERO
       ============================================================ */
    .elx-hero {
      text-align: center;
      padding: 4px 0 20px;
      border-bottom: 1px solid var(--elx-line-2);
      margin-bottom: 6px;
    }
    .elx-hero .badge-big {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 60px; height: 60px;
      border-radius: 50%;
      margin-bottom: 14px;
    }
    .elx-hero .badge-big.ok   { background: var(--elx-green-soft); color: var(--elx-green); }
    .elx-hero .badge-big.err  { background: var(--elx-red-soft);   color: var(--elx-red); }
    .elx-hero .badge-big.warn { background: var(--elx-amber-soft); color: var(--elx-amber); }
    .elx-hero .badge-big svg  { width: 30px; height: 30px; }
    .elx-hero .h-title {
      font-size: 17px;
      font-weight: 800;
      color: var(--elx-ink);
      margin-bottom: 6px;
      letter-spacing: -.01em;
    }
    .elx-hero .h-sub {
      font-size: 13px;
      color: var(--elx-muted);
      font-weight: 500;
      line-height: 1.5;
    }

    /* ============================================================
       PAGINATION ("1 of 6")
       ============================================================ */
    .elx-pager {
      text-align: center;
      font-size: 12.5px;
      color: var(--elx-muted);
      font-weight: 600;
      padding: 16px 0 4px;
      letter-spacing: .02em;
    }
    .elx-pager .cur { color: var(--elx-green); font-weight: 800; }

    /* ============================================================
       UTIL
       ============================================================ */
    .elx-hidden { display: none !important; }
    .elx-muted  { color: var(--elx-muted); font-size: 12.5px; }
    .elx-mb-0   { margin-bottom: 0 !important; }
  </style>
</head>
<body class="home elx-body">

  <div id="app-header"></div>

  <main class="app-container">
    <div class="elx-wrap">

      <!-- ============================================================
           HEADER (back arrow + eyebrow + title + lightning icon)
           ============================================================ -->
      <div class="elx-hdr">
        <button class="elx-hdr-back" id="btnBack" style="display:none;" aria-label="Back">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/></svg>
        </button>
        <div class="elx-hdr-info">
          <div class="eyebrow" id="hdrEyebrow">SERVICE</div>
          <div class="title" id="hdrTitle">Electricity</div>
        </div>
        <div class="elx-hdr-icon">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
        </div>
      </div>

      <!-- ============================================================
           STEP 1 — Discos list
           ============================================================ -->
      <div id="step1">
        <div class="elx-list" id="discoList">
          <div class="elx-row"><div class="elx-skel" style="width:46px;height:46px;border-radius:12px;"></div><div style="flex:1"><div class="elx-skel" style="width:65%;height:14px;margin-bottom:7px;"></div><div class="elx-skel" style="width:35%;height:11px;"></div></div></div>
          <div class="elx-row"><div class="elx-skel" style="width:46px;height:46px;border-radius:12px;"></div><div style="flex:1"><div class="elx-skel" style="width:55%;height:14px;margin-bottom:7px;"></div><div class="elx-skel" style="width:30%;height:11px;"></div></div></div>
          <div class="elx-row"><div class="elx-skel" style="width:46px;height:46px;border-radius:12px;"></div><div style="flex:1"><div class="elx-skel" style="width:60%;height:14px;margin-bottom:7px;"></div><div class="elx-skel" style="width:32%;height:11px;"></div></div></div>
          <div class="elx-row"><div class="elx-skel" style="width:46px;height:46px;border-radius:12px;"></div><div style="flex:1"><div class="elx-skel" style="width:50%;height:14px;margin-bottom:7px;"></div><div class="elx-skel" style="width:28%;height:11px;"></div></div></div>
        </div>
        <div class="elx-pager" id="discoPager" style="display:none;"></div>
      </div>

      <!-- ============================================================
           STEP 2 — Products for a disco (prepaid first, then postpaid)
           ============================================================ -->
      <div id="step2" class="elx-hidden">
        <div class="elx-list" id="prodList"></div>
      </div>

      <!-- ============================================================
           STEP 3 — Checkout (Customer ID + Verify + Amount)
           ============================================================ -->
      <div id="step3" class="elx-hidden">

        <!-- Product summary card -->
        <div class="elx-card tight" id="summaryCard">
          <div style="display:flex;align-items:center;gap:14px;">
            <div class="elx-logo" id="sumLogo"></div>
            <div style="flex:1;min-width:0;">
              <div style="font-size:15px;font-weight:800;color:var(--elx-ink);letter-spacing:-.005em;" id="sumName">—</div>
              <div style="font-size:11.5px;color:var(--elx-muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-top:3px;" id="sumProvider">—</div>
            </div>
          </div>
        </div>

        <!-- Customer ID -->
        <div class="elx-card">
          <div class="elx-label">Customer ID</div>
          <div class="elx-input-row">
            <input id="meter" class="elx-input" type="tel" inputmode="numeric"
                   placeholder="Enter meter number" maxlength="13" autocomplete="off" />
            <button class="elx-pick-btn" id="btnPick" title="Pick from contacts">
              <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
              Pick
            </button>
          </div>
          <div id="verifyMsg"></div>
        </div>

        <!-- Verified banner + customer details -->
        <div id="verifiedBlock" class="elx-hidden">
          <div class="elx-verified-banner">
            <div class="vb-icon">
              <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
            </div>
            <div class="vb-title">Verified Successfully</div>
            <div class="vb-sub">Customer information has been confirmed</div>
          </div>

          <div class="elx-details-label">Customer Details</div>
          <div class="elx-card">
            <div class="elx-kv"><span class="k">Service Name</span><span class="v" id="dService">—</span></div>
            <div class="elx-kv"><span class="k">Customer Id</span><span class="v" id="dId">—</span></div>
            <div class="elx-kv"><span class="k">Customer Name</span><span class="v" id="dName">—</span></div>
            <div class="elx-kv"><span class="k">Customer Address</span><span class="v" id="dAddr">—</span></div>
            <div class="elx-kv" id="dArrearsRow" style="display:none;"><span class="k">Arrears</span><span class="v" id="dArrears">—</span></div>
          </div>

          <!-- Amount -->
          <div class="elx-card">
            <div class="elx-label">Amount (₦)</div>
            <input id="amount" class="elx-input" type="tel" inputmode="numeric"
                   placeholder="0" autocomplete="off" />
            <div id="amountMsg" class="elx-muted" style="margin-top:12px;"></div>
          </div>

          <button class="elx-btn green" id="btnPay" disabled>Pay</button>
        </div>

        <!-- Verify button (shown only when NOT verified yet) -->
        <button class="elx-btn blue" id="btnVerify" disabled>Verify Customer</button>
      </div>

      <!-- ============================================================
           STEP 4 — Confirm
           ============================================================ -->
      <div id="step4" class="elx-hidden">
        <div class="elx-card">
          <div class="elx-kv"><span class="k">Disco</span><span class="v" id="cDisco">—</span></div>
          <div class="elx-kv"><span class="k">Meter type</span><span class="v" id="cType">—</span></div>
          <div class="elx-kv"><span class="k">Meter</span><span class="v" id="cMeter">—</span></div>
          <div class="elx-kv"><span class="k">Customer</span><span class="v" id="cName">—</span></div>
          <div class="elx-kv"><span class="k">Amount</span><span class="v" id="cAmount">—</span></div>
        </div>
        <div id="payMsg"></div>
        <button class="elx-btn green" id="btnConfirm">Confirm &amp; Pay</button>
      </div>

      <!-- ============================================================
           STEP 5 — Receipt
           ============================================================ -->
      <div id="step5" class="elx-hidden">
        <div class="elx-card" id="resultCard"></div>
        <button class="elx-btn ghost" id="btnNew" style="margin-top:14px;">Buy another</button>
      </div>

    </div>
  </main>

  <script src="/js/auth-guard.js"></script>
  <script src="/js/api.js"></script>
  <script type="module" src="/js/components.js"></script>

  <script>
  /* ============================================================
     ELECTRICITY — page controller (DataShop-flow parity)
     ============================================================ */
  (function () {
    'use strict';

    var API = '/api/v1/electricity';
    var TOKEN_KEYS = ['token','authToken','access_token','accessToken','shatova_token','jwt'];

    /* ------------------------------------------------------------
       Real brand logos — Wikimedia, with initials fallback
       ------------------------------------------------------------ */
    var DISCO_LOGOS = {
      'Aba Power': [
        'https://upload.wikimedia.org/wikipedia/en/thumb/9/9a/Aba_Power_logo.png/120px-Aba_Power_logo.png'
      ],
      'Abuja Electric': [
        'https://upload.wikimedia.org/wikipedia/en/thumb/5/5a/AEDC_logo.png/120px-AEDC_logo.png',
        'https://upload.wikimedia.org/wikipedia/en/thumb/3/3d/Abuja_Electricity_Distribution_Company_logo.png/120px-Abuja_Electricity_Distribution_Company_logo.png'
      ],
      'Benin Electric': [
        'https://upload.wikimedia.org/wikipedia/en/thumb/4/4d/BEDC_logo.png/120px-BEDC_logo.png'
      ],
      'Eko Electric': [
        'https://upload.wikimedia.org/wikipedia/en/thumb/8/8e/Eko_Electricity_Distribution_Company_logo.png/120px-Eko_Electricity_Distribution_Company_logo.png'
      ],
      'Enugu Electric': [
        'https://upload.wikimedia.org/wikipedia/en/thumb/6/6b/Enugu_Electricity_Distribution_Company_logo.png/120px-Enugu_Electricity_Distribution_Company_logo.png'
      ],
      'Ibadan Electric': [
        'https://upload.wikimedia.org/wikipedia/en/thumb/2/2f/IBEDC_logo.png/120px-IBEDC_logo.png'
      ],
      'Ikeja Electric': [
        'https://upload.wikimedia.org/wikipedia/en/thumb/1/1e/Ikeja_Electric_logo.png/120px-Ikeja_Electric_logo.png'
      ],
      'Jos Electric': [
        'https://upload.wikimedia.org/wikipedia/en/thumb/3/3e/Jos_Electricity_Distribution_Company_logo.png/120px-Jos_Electricity_Distribution_Company_logo.png'
      ],
      'Kaduna Electric': [
        'https://upload.wikimedia.org/wikipedia/en/thumb/6/6d/Kaduna_Electricity_Company_logo.png/120px-Kaduna_Electricity_Company_logo.png'
      ],
      'Kano Electric': [
        'https://upload.wikimedia.org/wikipedia/en/thumb/f/f2/Kano_Electricity_Distribution_Company_logo.png/120px-Kano_Electricity_Distribution_Company_logo.png'
      ],
      'Portharcourt Electric': [
        'https://upload.wikimedia.org/wikipedia/en/thumb/5/5c/Port_Harcourt_Electricity_Distribution_Company_logo.png/120px-Port_Harcourt_Electricity_Distribution_Company_logo.png'
      ],
      'Yola Electric': [
        'https://upload.wikimedia.org/wikipedia/en/thumb/2/2e/Yola_Electricity_Distribution_Company_logo.png/120px-Yola_Electricity_Distribution_Company_logo.png'
      ]
    };

    /* ------------------------------------------------------------
       Helpers
       ------------------------------------------------------------ */
    function $(id) { return document.getElementById(id); }
    function getToken() {
      for (var i = 0; i < TOKEN_KEYS.length; i++) {
        var v = localStorage.getItem(TOKEN_KEYS[i]);
        if (v) return v;
      }
      return null;
    }
    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }
    function fmt(n) {
      return '₦' + Number(n || 0).toLocaleString('en-NG', { minimumFractionDigits: 0 });
    }
    function initials(name) {
      return String(name || '').split(/\s+/).map(function (w) { return w[0] || ''; })
        .join('').slice(0, 2).toUpperCase();
    }

    /* ------------------------------------------------------------
       API
       ------------------------------------------------------------ */
    async function callApi(path, opts) {
      opts = opts || {};
      var token = getToken();
      var headers = { 'Content-Type': 'application/json' };
      if (token) headers['Authorization'] = 'Bearer ' + token;
      var init = { method: opts.method || 'GET', headers: headers };
      if (opts.body) init.body = JSON.stringify(opts.body);
      console.log('[elec] →', init.method, API + path, token ? '(auth)' : '(no token)');

      var res;
      try {
        res = await fetch(API + path, init);
      } catch (netErr) {
        console.error('[elec] network:', netErr);
        throw new Error('Cannot reach server. Check your connection.');
      }
      var text = await res.text();
      var json = {};
      try { json = text ? JSON.parse(text) : {}; }
      catch (_) {
        console.error('[elec] non-JSON:', res.status, text.slice(0, 300));
        throw new Error('Server returned an unexpected response (HTTP ' + res.status + ').');
      }
      console.log('[elec] ←', res.status, json);
      if (!res.ok || json.success === false) {
        var e = new Error(json.message || json.error || ('Request failed (HTTP ' + res.status + ')'));
        e.code = json.code; e.status = res.status;
        throw e;
      }
      return json.data;
    }

    /* ------------------------------------------------------------
       State
       ------------------------------------------------------------ */
    var state = {
      products: null,
      provider: null,
      billType: null,
      productName: null,
      productDesc: '',
      meterNumber: '',
      verified: null,
      amount: null,
      reference: null,
      pollTimer: null
    };

    /* ------------------------------------------------------------
       Navigation
       ------------------------------------------------------------ */
    function showStep(n) {
      [1,2,3,4,5].forEach(function (i) {
        var el = $('step' + i);
        if (el) el.classList.toggle('elx-hidden', i !== n);
      });
      $('btnBack').style.display = (n === 1) ? 'none' : 'flex';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    function setHeader(eyebrow, title) {
      $('hdrEyebrow').textContent = eyebrow;
      $('hdrTitle').textContent = title;
    }

    $('btnBack').addEventListener('click', function () {
      if (!$('step5').classList.contains('elx-hidden')) { resetAll(); return; }
      if (!$('step4').classList.contains('elx-hidden')) {
        setHeader(state.productName, 'Checkout'); showStep(3); return;
      }
      if (!$('step3').classList.contains('elx-hidden')) {
        setHeader(state.provider.toUpperCase(), 'Choose meter type'); showStep(2); return;
      }
      if (!$('step2').classList.contains('elx-hidden')) {
        setHeader('SERVICE', 'Electricity'); showStep(1); return;
      }
    });

    /* ------------------------------------------------------------
       STEP 1 — Discos
       ------------------------------------------------------------ */
    async function loadProducts() {
      try {
        var data = await callApi('/products');
        state.products = data;
        var providers = (data && data.providers) || [];
        if (!providers.length) {
          $('discoList').innerHTML = '<div class="elx-alert warn">No discos available right now. Please try again later.</div>';
          return;
        }
        renderDiscos(providers);
        renderPager(1, providers.length);
      } catch (err) {
        console.error('[elec] load failed:', err);
        var hint = '';
        if (err.status === 401) hint = '<br><span style="font-size:11px;font-weight:500;">You are not signed in. Please log in again.</span>';
        if (err.status === 404) hint = '<br><span style="font-size:11px;font-weight:500;">Backend route not mounted. Check app.js.</span>';
        $('discoList').innerHTML = '<div class="elx-alert err">' + esc(err.message) + hint + '</div>';
      }
    }

    function logoHtml(provider, size) {
      var urls = DISCO_LOGOS[provider] || [];
      var first = urls[0] || '';
      var rest  = urls.slice(1).join('|');
      var style = size ? ' style="width:' + size + 'px;height:' + size + 'px;"' : '';
      return '<div class="elx-logo"' + style + '>' +
               (first
                 ? '<img src="' + esc(first) + '" alt="' + esc(provider) + '" ' +
                   'data-fallbacks="' + esc(rest) + '" ' +
                   'onerror="elxLogoFallback(this)" />'
                 : '<div class="ini">' + esc(initials(provider)) + '</div>') +
             '</div>';
    }
    window.elxLogoFallback = function (imgEl) {
      var queue = (imgEl.dataset.fallbacks || '').split('|').filter(Boolean);
      if (queue.length) {
        imgEl.dataset.fallbacks = queue.slice(1).join('|');
        imgEl.src = queue[0];
        return;
      }
      var wrap = imgEl.parentNode;
      wrap.innerHTML = '<div class="ini">' + esc(initials(imgEl.alt || '')) + '</div>';
    };

    function renderDiscos(providers) {
      $('discoList').innerHTML = providers.map(function (p) {
        var count = (p.products || []).length;
        return '' +
          '<div class="elx-row" data-provider="' + esc(p.provider) + '">' +
            logoHtml(p.provider) +
            '<div class="elx-info">' +
              '<div class="name">' + esc(p.provider.toUpperCase()) + '</div>' +
              '<div class="meta">' + count + ' product' + (count === 1 ? '' : 's') + '</div>' +
            '</div>' +
            '<svg class="elx-chev" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"/></svg>' +
          '</div>';
      }).join('');
    }
    function renderPager(cur, total) {
      $('discoPager').style.display = total ? 'block' : 'none';
      $('discoPager').innerHTML = '<span class="cur">1</span> of ' + Math.max(1, Math.ceil(total / 8));
    }

    /* ------------------------------------------------------------
       STEP 2 — Products
       ------------------------------------------------------------ */
    function renderProducts(provider) {
      var prov = state.products.providers.find(function (p) { return p.provider === provider; });
      if (!prov) return;
      var list = (prov.products || []).slice().sort(function (a, b) {
        var order = { prepaid: 0, postpaid: 1 };
        return (order[a.bill_type] || 99) - (order[b.bill_type] || 99);
      });
      $('prodList').innerHTML = list.map(function (p) {
        var isPre = p.bill_type === 'prepaid';
        var title = p.product_name;
        return '' +
          '<div class="elx-prod" data-product="' + esc(p.product_name) + '" data-type="' + esc(p.bill_type) + '">' +
            '<div class="elx-prod-top">' +
              logoHtml(p.provider, 42) +
              '<div class="elx-prod-name">' +
                '<div class="n">' + esc(title) + '</div>' +
                '<div class="p">' + esc(p.provider) + '</div>' +
                (isPre ? '<div class="tag">1% off</div>' : '<div class="tag">1% off</div>') +
              '</div>' +
            '</div>' +
            '<div class="elx-prod-desc">' + esc(p.description || (isPre ? 'Prepaid meter — get token instantly' : 'Postpaid meter — settle your bill')) + '</div>' +
            '<div class="elx-prod-foot">' +
              '<div class="elx-prod-status">Open</div>' +
              '<button class="elx-prod-buy" type="button">Buy ›</button>' +
            '</div>' +
          '</div>';
      }).join('');
    }

    /* ------------------------------------------------------------
       Event delegation
       ------------------------------------------------------------ */
    document.addEventListener('click', function (e) {
      /* Disco row */
      var row = e.target.closest('.elx-row');
      if (row && row.dataset.provider) {
        state.provider = row.dataset.provider;
        setHeader(state.provider.toUpperCase(), 'Choose meter type');
        renderProducts(state.provider);
        showStep(2);
        return;
      }
      /* Product card */
      var prod = e.target.closest('.elx-prod');
      if (prod && prod.dataset.product) {
        /* Reset checkout state */
        state.productName = prod.dataset.product;
        state.billType    = prod.dataset.type;
        state.meterNumber = '';
        state.verified    = null;
        state.amount      = null;

        $('meter').value = '';
        $('amount').value = '';
        $('verifiedBlock').classList.add('elx-hidden');
        $('btnVerify').classList.remove('elx-hidden');
        $('btnVerify').disabled = true;
        $('btnPay').disabled = true;
        $('verifyMsg').innerHTML = '';
        $('amountMsg').textContent = '';
        $('dArrearsRow').style.display = 'none';

        /* Summary card */
        var prov = state.products.providers.find(function (p) { return p.provider === state.provider; });
        var prodObj = prov && prov.products.find(function (p) { return p.product_name === state.productName; });
        $('sumLogo').outerHTML = logoHtml(state.provider, 46).replace('class="elx-logo"', 'class="elx-logo" id="sumLogo"');
        $('sumName').textContent = state.productName;
        $('sumProvider').textContent = state.provider;

        setHeader(state.productName, 'Checkout');
        showStep(3);
        setTimeout(function () { $('meter').focus(); }, 250);
        return;
      }
    });

    /* ------------------------------------------------------------
       Meter input + verify
       ------------------------------------------------------------ */
    $('meter').addEventListener('input', function (e) {
      e.target.value = e.target.value.replace(/\D/g, '').slice(0, 13);
      state.meterNumber = e.target.value;
      $('btnVerify').disabled = state.meterNumber.length < 11;
      $('verifiedBlock').classList.add('elx-hidden');
      $('btnVerify').classList.remove('elx-hidden');
      $('verifyMsg').innerHTML = '';
    });

    $('btnPick').addEventListener('click', function () {
      alert('Contact picker not enabled. Please type the meter number.');
    });

    /* Simple 60s client cache so repeat verifies are instant */
    var verifyCache = new Map();
    function cacheKey(p, m) { return p + '::' + m; }

    $('btnVerify').addEventListener('click', async function () {
      if (!state.productName) return;
      $('verifyMsg').innerHTML = '<div class="elx-alert ok"><span class="elx-spin"></span>Verifying meter…</div>';
      $('btnVerify').disabled = true;

      var key = cacheKey(state.productName, state.meterNumber);
      var hit = verifyCache.get(key);
      if (hit && Date.now() < hit.exp) {
        console.log('[elec] verify (client cache)');
        finishVerify(hit.value);
        return;
      }

      var t0 = performance.now();
      try {
        var v = await callApi('/verify', {
          method: 'POST',
          body: { product_name: state.productName, meter_number: state.meterNumber }
        });
        console.log('[elec] verify took ' + Math.round(performance.now() - t0) + 'ms');
        verifyCache.set(key, { value: v, exp: Date.now() + 60000 });
        finishVerify(v);
      } catch (err) {
        console.error('[elec] verify:', err);
        $('verifyMsg').innerHTML = '<div class="elx-alert err">' + esc(err.message) + '</div>';
        $('btnVerify').disabled = false;
      }
    });

    function finishVerify(v) {
      state.verified = v;

      $('dService').textContent = v.disco || v.service_name || state.provider || '—';
      $('dId').textContent      = v.meter_number || state.meterNumber;
      $('dName').textContent    = v.customer_name || '—';
      $('dAddr').textContent    = v.customer_address || '—';
      if (v.customer_arrears > 0) {
        $('dArrears').textContent = fmt(v.customer_arrears);
        $('dArrearsRow').style.display = 'flex';
      } else {
        $('dArrearsRow').style.display = 'none';
      }

      $('verifyMsg').innerHTML = '';
      $('btnVerify').classList.add('elx-hidden');
      $('verifiedBlock').classList.remove('elx-hidden');

      var min = v.minimum_amount || 1000;
      var max = v.maximum_amount || 200000;
      $('amountMsg').textContent = 'Minimum ' + fmt(min) + ' · Maximum ' + fmt(max);
      $('amount').placeholder = String(min);
      $('btnVerify').disabled = false;
    }

    /* ------------------------------------------------------------
       Amount
       ------------------------------------------------------------ */
    $('amount').addEventListener('input', function (e) {
      e.target.value = e.target.value.replace(/\D/g, '');
      state.amount = Number(e.target.value) || 0;
      validateAmount();
    });

    function validateAmount() {
      var v = state.verified;
      if (!v) return;
      var min = v.minimum_amount || 1000;
      var max = v.maximum_amount || 200000;
      var a = state.amount || 0;
      if (!a) { $('amountMsg').textContent = ''; $('btnPay').disabled = true; return; }
      if (a < min) { $('amountMsg').textContent = 'Minimum is ' + fmt(min); $('btnPay').disabled = true; return; }
      if (a > max) { $('amountMsg').textContent = 'Maximum is ' + fmt(max); $('btnPay').disabled = true; return; }
      $('amountMsg').textContent = 'You will pay ' + fmt(a);
      $('btnPay').disabled = false;
    }

    $('btnPay').addEventListener('click', function () {
      var v = state.verified;
      $('cDisco').textContent  = v.disco || v.service_name || state.provider || '—';
      $('cType').textContent   = v.bill_type || state.billType || '—';
      $('cMeter').textContent  = v.meter_number || state.meterNumber;
      $('cName').textContent   = v.customer_name || '—';
      $('cAmount').textContent = fmt(state.amount);
      setHeader('CONFIRM', 'Review payment');
      showStep(4);
    });

    /* ------------------------------------------------------------
       Purchase
       ------------------------------------------------------------ */
    $('btnConfirm').addEventListener('click', async function () {
      $('btnConfirm').disabled = true;
      $('payMsg').innerHTML = '<div class="elx-alert ok"><span class="elx-spin"></span>Processing payment…</div>';

      try {
        var r = await callApi('/purchase', {
          method: 'POST',
          body: {
            product_name:   state.productName,
            meter_number:   state.meterNumber,
            amount:         state.amount,
            payment_method: 'wallet'
          }
        });
        state.reference = r.reference;
        if (r.status === 'success')         renderSuccess(r);
        else if (r.status === 'processing') renderProcessing(r);
        else                                renderFailure(r);
      } catch (err) {
        console.error('[elec] purchase:', err);
        $('payMsg').innerHTML = '';
        renderFailure({ remark: err.message, reference: null });
      } finally {
        $('btnConfirm').disabled = false;
      }
    });

    /* ------------------------------------------------------------
       Result renderers
       ------------------------------------------------------------ */
    function renderSuccess(r) {
      setHeader('RECEIPT', 'Payment successful');
      showStep(5);
      var tokenBlock = r.token
        ? '<div class="elx-token">' +
            '<div class="lbl">Your token</div>' +
            '<div class="tok" id="tokText">' + esc(r.token) + '</div>' +
            (r.units ? '<div class="units">' + esc(r.units) + ' kWh</div>' : '') +
            '<button class="elx-copy" id="copyTok">Copy token</button>' +
          '</div>'
        : '';
      $('resultCard').innerHTML =
        '<div class="elx-hero">' +
          '<div class="badge-big ok">' +
            '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/></svg>' +
          '</div>' +
          '<div class="h-title">Payment successful</div>' +
          '<div class="h-sub">Your meter has been credited</div>' +
        '</div>' +
        '<div style="margin-top:16px;">' +
          '<div class="elx-kv"><span class="k">Disco</span><span class="v">' + esc(r.disco || r.provider || state.provider || '') + '</span></div>' +
          '<div class="elx-kv"><span class="k">Meter</span><span class="v">' + esc(r.meter_number || state.meterNumber) + '</span></div>' +
          '<div class="elx-kv"><span class="k">Customer</span><span class="v">' + esc(r.customer_name || (state.verified && state.verified.customer_name) || '—') + '</span></div>' +
          '<div class="elx-kv"><span class="k">Amount</span><span class="v">' + fmt(r.amount || state.amount) + '</span></div>' +
          '<div class="elx-kv"><span class="k">Reference</span><span class="v" style="font-size:11px;font-weight:600;">' + esc(r.reference) + '</span></div>' +
        '</div>' +
        tokenBlock;
      var btn = $('copyTok');
      if (btn) btn.addEventListener('click', function () {
        try { navigator.clipboard.writeText(r.token); btn.textContent = 'Copied ✓'; }
        catch (_) { window.prompt('Copy your token:', r.token); }
      });
    }

    function renderProcessing(r) {
      setHeader('RECEIPT', 'Confirming with provider');
      showStep(5);
      $('resultCard').innerHTML =
        '<div class="elx-hero">' +
          '<div class="badge-big warn">' +
            '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>' +
          '</div>' +
          '<div class="h-title">Confirming with provider</div>' +
          '<div class="h-sub">This is taking a bit longer than usual.<br>We\'ll update this screen automatically.</div>' +
        '</div>' +
        '<div style="margin-top:16px;">' +
          '<div class="elx-kv"><span class="k">Reference</span><span class="v" style="font-size:11px;font-weight:600;">' + esc(r.reference) + '</span></div>' +
          '<div class="elx-kv"><span class="k">Status</span><span class="v" id="pollStatus">processing</span></div>' +
        '</div>';
      pollStatus(r.reference);
    }

    function renderFailure(r) {
      setHeader('RECEIPT', 'Payment failed');
      showStep(5);
      $('resultCard').innerHTML =
        '<div class="elx-hero">' +
          '<div class="badge-big err">' +
            '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.6" d="M6 18L18 6M6 6l12 12"/></svg>' +
          '</div>' +
          '<div class="h-title">Payment failed</div>' +
          '<div class="h-sub">' + esc(r.remark || 'Please try again.') + '</div>' +
        '</div>' +
        (r.reference
          ? '<div style="margin-top:16px;"><div class="elx-kv"><span class="k">Reference</span><span class="v" style="font-size:11px;font-weight:600;">' + esc(r.reference) + '</span></div></div>'
          : '');
    }

    function pollStatus(reference) {
      if (state.pollTimer) clearInterval(state.pollTimer);
      var tries = 0, MAX = 72;
      state.pollTimer = setInterval(async function () {
        tries++;
        if (tries > MAX) { clearInterval(state.pollTimer); return; }
        try {
          var s = await callApi('/status?reference=' + encodeURIComponent(reference));
          var el = $('pollStatus');
          if (el) el.textContent = s.status;
          if (s.status === 'success') {
            clearInterval(state.pollTimer);
            renderSuccess(Object.assign({}, s, { reference: reference }));
          } else if (s.status === 'failed') {
            clearInterval(state.pollTimer);
            renderFailure(Object.assign({}, s, { reference: reference }));
          }
        } catch (err) { console.warn('[elec] poll:', err.message); }
      }, 5000);
    }

    /* ------------------------------------------------------------
       Reset
       ------------------------------------------------------------ */
    function resetAll() {
      if (state.pollTimer) clearInterval(state.pollTimer);
      state = {
        products: state.products,
        provider: null, billType: null, productName: null,
        meterNumber: '', verified: null, amount: null,
        reference: null, pollTimer: null
      };
      $('meter').value = '';
      $('amount').value = '';
      $('verifiedBlock').classList.add('elx-hidden');
      $('btnVerify').classList.remove('elx-hidden');
      $('btnVerify').disabled = true;
      $('btnPay').disabled = true;
      $('verifyMsg').innerHTML = '';
      $('payMsg').innerHTML = '';
      $('amountMsg').textContent = '';
      setHeader('SERVICE', 'Electricity');
      showStep(1);
    }
    $('btnNew').addEventListener('click', resetAll);

    /* ------------------------------------------------------------
       Boot
       ------------------------------------------------------------ */
    setHeader('SERVICE', 'Electricity');
    showStep(1);
    loadProducts();

  })();
  </script>
</body>
</html>
