<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Shatova - Electricity</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/home.css">
  <link rel="stylesheet" href="/css/menu.css">

  <style>
    /* ============================================================
       ELECTRICITY — page-specific styles (all namespaced .elec-)
       ============================================================ */
    .elec-wrap {
      max-width: 520px;
      margin: 0 auto;
      padding: 16px 16px 120px;
    }

    .elec-title {
      font-size: 22px;
      font-weight: 800;
      margin: 4px 0 4px;
      color: var(--text, #0f172a);
    }
    .elec-sub {
      font-size: 13px;
      color: var(--muted, #64748b);
      margin-bottom: 18px;
    }

    .elec-card {
      background: var(--card, #ffffff);
      border: 1px solid var(--line, #e2e8f0);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 1px 2px rgba(0,0,0,.03);
    }

    .elec-label {
      font-size: 11px;
      color: var(--muted, #64748b);
      text-transform: uppercase;
      letter-spacing: .08em;
      font-weight: 700;
      margin-bottom: 10px;
    }

    /* ---------- Disco grid ---------- */
    .elec-discos {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .elec-disco {
      background: var(--bg-soft, #f8fafc);
      border: 1.5px solid var(--line, #e2e8f0);
      border-radius: 12px;
      padding: 14px 10px;
      text-align: center;
      cursor: pointer;
      transition: .15s;
      font-size: 12px;
      font-weight: 700;
      color: var(--text, #0f172a);
      -webkit-tap-highlight-color: transparent;
    }
    .elec-disco:active { transform: scale(.97); }
    .elec-disco.active {
      border-color: var(--brand, #16a34a);
      background: var(--brand-soft, #ecfdf5);
      color: var(--brand, #16a34a);
    }
    .elec-disco .ini {
      display: block;
      width: 34px; height: 34px;
      line-height: 34px;
      border-radius: 50%;
      background: var(--line, #e2e8f0);
      color: var(--muted, #64748b);
      margin: 0 auto 6px;
      font-weight: 800;
      font-size: 13px;
      transition: .15s;
    }
    .elec-disco.active .ini {
      background: var(--brand, #16a34a);
      color: #fff;
    }

    /* ---------- Bill-type toggle ---------- */
    .elec-toggle {
      display: flex;
      gap: 6px;
      background: var(--bg-soft, #f1f5f9);
      padding: 4px;
      border-radius: 12px;
    }
    .elec-toggle button {
      flex: 1;
      background: transparent;
      border: 0;
      color: var(--muted, #64748b);
      padding: 11px;
      font-weight: 700;
      border-radius: 9px;
      cursor: pointer;
      font-size: 13px;
      transition: .15s;
    }
    .elec-toggle button.on {
      background: var(--brand, #16a34a);
      color: #fff;
      box-shadow: 0 1px 3px rgba(0,0,0,.15);
    }

    /* ---------- Inputs ---------- */
    .elec-input {
      width: 100%;
      background: var(--bg-soft, #f8fafc);
      border: 1.5px solid var(--line, #e2e8f0);
      color: var(--text, #0f172a);
      padding: 14px 14px;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
      font-family: inherit;
      transition: .15s;
      box-sizing: border-box;
    }
    .elec-input:focus { border-color: var(--brand, #16a34a); }

    /* ---------- Quick amount chips ---------- */
    .elec-chips {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
    }
    .elec-chip {
      background: var(--bg-soft, #f8fafc);
      border: 1.5px solid var(--line, #e2e8f0);
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      color: var(--text, #0f172a);
      transition: .15s;
    }
    .elec-chip:active { transform: scale(.96); }
    .elec-chip.active {
      background: var(--brand-soft, #ecfdf5);
      border-color: var(--brand, #16a34a);
      color: var(--brand, #16a34a);
    }

    /* ---------- Buttons ---------- */
    .elec-btn {
      width: 100%;
      border: 0;
      padding: 16px;
      border-radius: 14px;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      transition: .15s;
      font-family: inherit;
      margin-top: 6px;
    }
    .elec-btn.primary {
      background: var(--brand, #16a34a);
      color: #fff;
      box-shadow: 0 4px 12px rgba(22,163,74,.25);
    }
    .elec-btn.primary:active:not(:disabled) { transform: scale(.98); }
    .elec-btn.primary:disabled {
      opacity: .45;
      cursor: not-allowed;
      box-shadow: none;
    }
    .elec-btn.ghost {
      background: transparent;
      border: 1.5px solid var(--line, #e2e8f0);
      color: var(--text, #0f172a);
    }

    /* ---------- Key-value rows ---------- */
    .elec-kv {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px dashed var(--line, #e2e8f0);
      font-size: 13.5px;
    }
    .elec-kv:last-child { border-bottom: 0; }
    .elec-kv .k { color: var(--muted, #64748b); font-weight: 500; }
    .elec-kv .v {
      font-weight: 700;
      text-align: right;
      max-width: 60%;
      color: var(--text, #0f172a);
      word-break: break-word;
    }

    /* ---------- Verified box ---------- */
    .elec-verified {
      background: #ecfdf5;
      border: 1.5px solid #86efac;
      padding: 14px;
      border-radius: 12px;
      margin-top: 12px;
    }
    .elec-verified .name {
      color: #065f46;
      font-weight: 800;
      font-size: 14px;
      margin-bottom: 4px;
    }
    .elec-verified .addr {
      color: #047857;
      font-size: 12px;
      line-height: 1.5;
    }

    /* ---------- Token display ---------- */
    .elec-tokenbox {
      background: #f0fdf4;
      border: 1.5px dashed #16a34a;
      border-radius: 14px;
      padding: 18px 14px;
      margin-top: 12px;
      text-align: center;
    }
    .elec-tokenbox .tok {
      font-family: ui-monospace, Menlo, monospace;
      font-size: 19px;
      font-weight: 800;
      letter-spacing: 2.5px;
      color: #065f46;
      word-break: break-all;
      line-height: 1.4;
    }
    .elec-tokenbox .units {
      color: #047857;
      font-size: 12px;
      margin-top: 8px;
      font-weight: 600;
    }
    .elec-copy {
      margin-top: 12px;
      background: #16a34a;
      border: 0;
      color: #fff;
      padding: 9px 18px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .elec-copy:active { transform: scale(.96); }

    /* ---------- Alerts ---------- */
    .elec-alert {
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 13px;
      margin-top: 10px;
      font-weight: 600;
      line-height: 1.45;
    }
    .elec-alert.err   { background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; }
    .elec-alert.warn  { background: #fffbeb; border: 1px solid #fde68a; color: #92400e; }
    .elec-alert.ok    { background: #ecfdf5; border: 1px solid #86efac; color: #065f46; }

    /* ---------- Spinner ---------- */
    .elec-spinner {
      display: inline-block;
      width: 15px; height: 15px;
      border: 2px solid rgba(255,255,255,.45);
      border-top-color: #fff;
      border-radius: 50%;
      animation: elec-spin .8s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
      position: relative;
      top: -1px;
    }
    .elec-alert.ok .elec-spinner {
      border-color: rgba(6,95,70,.35);
      border-top-color: #065f46;
    }
    @keyframes elec-spin { to { transform: rotate(360deg); } }

    /* ---------- Step dots ---------- */
    .elec-dots {
      display: flex;
      gap: 6px;
      justify-content: center;
      margin: 4px 0 18px;
    }
    .elec-dots i {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--line, #e2e8f0);
      transition: .2s;
    }
    .elec-dots i.on { background: var(--brand, #16a34a); }

    .elec-hidden { display: none !important; }
    .elec-muted  { color: var(--muted, #64748b); font-size: 12.5px; }
    .elec-center { text-align: center; }
  </style>
</head>
<body class="home">

  <div id="app-header"></div>

  <main class="app-container">
    <div class="elec-wrap">

      <h1 class="elec-title">Electricity</h1>
      <div class="elec-sub">Pay any Nigerian disco — prepaid or postpaid</div>

      <div class="elec-dots">
        <i id="d1" class="on"></i><i id="d2"></i><i id="d3"></i><i id="d4"></i>
      </div>

      <!-- ============================================================
           STEP 1 — Provider + bill type
           ============================================================ -->
      <div id="step1">
        <div class="elec-card">
          <div class="elec-label">Choose disco</div>
          <div id="discos" class="elec-discos">
            <div class="elec-muted">Loading…</div>
          </div>
        </div>

        <div class="elec-card elec-hidden" id="typeCard">
          <div class="elec-label">Meter type</div>
          <div class="elec-toggle" id="typeToggle">
            <button data-type="prepaid">Prepaid</button>
            <button data-type="postpaid">Postpaid</button>
          </div>
        </div>

        <button class="elec-btn primary" id="btnContinue" disabled>Continue</button>
      </div>

      <!-- ============================================================
           STEP 2 — Meter + verify + amount
           ============================================================ -->
      <div id="step2" class="elec-hidden">
        <div class="elec-card">
          <div class="elec-label">Meter number</div>
          <input id="meter" class="elec-input" type="tel" inputmode="numeric"
                 placeholder="e.g. 45705225097" maxlength="13" autocomplete="off" />
          <button class="elec-btn primary" id="btnVerify" disabled style="margin-top:12px;">
            Verify Meter
          </button>
          <div id="verifyMsg"></div>
          <div id="verifiedBox" class="elec-verified elec-hidden">
            <div class="name" id="vName"></div>
            <div class="addr" id="vAddr"></div>
            <div class="addr" id="vDisco"></div>
          </div>
        </div>

        <div class="elec-card elec-hidden" id="amountCard">
          <div class="elec-label">Amount (₦)</div>
          <input id="amount" class="elec-input" type="tel" inputmode="numeric"
                 placeholder="1000" autocomplete="off" />
          <div class="elec-chips" id="chips">
            <div class="elec-chip" data-amt="1000">₦1,000</div>
            <div class="elec-chip" data-amt="2000">₦2,000</div>
            <div class="elec-chip" data-amt="5000">₦5,000</div>
            <div class="elec-chip" data-amt="10000">₦10,000</div>
            <div class="elec-chip" data-amt="20000">₦20,000</div>
          </div>
          <div id="amountMsg" class="elec-muted" style="margin-top:10px;"></div>
        </div>

        <button class="elec-btn ghost" id="btnBack2">Back</button>
        <button class="elec-btn primary elec-hidden" id="btnPay" disabled>Pay</button>
      </div>

      <!-- ============================================================
           STEP 3 — Confirm
           ============================================================ -->
      <div id="step3" class="elec-hidden">
        <div class="elec-card">
          <div class="elec-label">Confirm payment</div>
          <div class="elec-kv"><span class="k">Disco</span><span class="v" id="cDisco"></span></div>
          <div class="elec-kv"><span class="k">Meter type</span><span class="v" id="cType"></span></div>
          <div class="elec-kv"><span class="k">Meter</span><span class="v" id="cMeter"></span></div>
          <div class="elec-kv"><span class="k">Customer</span><span class="v" id="cName"></span></div>
          <div class="elec-kv"><span class="k">Amount</span><span class="v" id="cAmount"></span></div>
          <div class="elec-kv"><span class="k">You pay</span><span class="v" id="cPay"></span></div>
        </div>
        <div id="payMsg"></div>
        <button class="elec-btn ghost" id="btnBack3">Back</button>
        <button class="elec-btn primary" id="btnConfirm">Confirm &amp; Pay</button>
      </div>

      <!-- ============================================================
           STEP 4 — Result
           ============================================================ -->
      <div id="step4" class="elec-hidden">
        <div class="elec-card elec-center" id="resultCard"></div>
        <button class="elec-btn ghost" id="btnNew">Buy another</button>
      </div>

    </div>
  </main>

  <script src="/js/auth-guard.js"></script>
  <script src="/js/api.js"></script>
  <script type="module" src="/js/components.js"></script>

  <script>
  /* ============================================================
     ELECTRICITY PAGE
     Uses window.api helper if available, falls back to fetch.
     ============================================================ */
  (function () {
    'use strict';

    const API_BASE = '/api/v1/electricity';
    const TOKEN_KEY_CANDIDATES = ['token', 'authToken', 'access_token', 'shatova_token'];

    /* ---------- Auth token lookup ---------- */
    function getToken() {
      for (const k of TOKEN_KEY_CANDIDATES) {
        const v = localStorage.getItem(k);
        if (v) return v;
      }
      return null;
    }

    /* ---------- HTTP helper ---------- */
    async function callApi(path, opts) {
      opts = opts || {};
      const token = getToken();
      const headers = { 'Content-Type': 'application/json' };
      if (token) headers['Authorization'] = 'Bearer ' + token;

      const res = await fetch(API_BASE + path, {
        method: opts.method || 'GET',
        headers,
        body: opts.body ? JSON.stringify(opts.body) : undefined,
      });

      let json = {};
      try { json = await res.json(); } catch (_) {}

      if (!res.ok || json.success === false) {
        const err = new Error(json.message || ('Request failed (' + res.status + ')'));
        err.code = json.code;
        err.data = json.data;
        throw err;
      }
      return json.data;
    }

    /* ---------- DOM shortcuts ---------- */
    const $ = (id) => document.getElementById(id);
    const fmt = (n) => '₦' + Number(n || 0).toLocaleString('en-NG', { minimumFractionDigits: 0 });

    /* ---------- State ---------- */
    const state = {
      products: null,
      provider: null,
      billType: null,
      productName: null,
      meterNumber: '',
      verified: null,
      amount: null,
      reference: null,
      pollTimer: null,
    };

    /* ---------- Step navigation ---------- */
    function showStep(n) {
      ['step1','step2','step3','step4'].forEach(function (id, i) {
        $(id).classList.toggle('elec-hidden', i + 1 !== n);
      });
      ['d1','d2','d3','d4'].forEach(function (id, i) {
        $(id).classList.toggle('on', i + 1 <= n);
      });
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function initials(name) {
      return String(name || '').split(/\s+/).map(function (w) { return w[0]; })
        .join('').slice(0, 2).toUpperCase();
    }

    /* ============================================================
       STEP 1 — Load products
       ============================================================ */
    async function loadProducts() {
      try {
        const data = await callApi('/products');
        state.products = data;
        renderDiscos(data.providers || []);
      } catch (err) {
        $('discos').innerHTML = '<div class="elec-alert err">' + err.message + '</div>';
      }
    }

    function renderDiscos(providers) {
      if (!providers.length) {
        $('discos').innerHTML = '<div class="elec-muted">No products available</div>';
        return;
      }
      $('discos').innerHTML = providers.map(function (p) {
        return '<div class="elec-disco" data-provider="' + p.provider + '">' +
                 '<span class="ini">' + initials(p.provider) + '</span>' +
                 p.provider +
               '</div>';
      }).join('');

      document.querySelectorAll('.elec-disco').forEach(function (el) {
        el.addEventListener('click', function () {
          document.querySelectorAll('.elec-disco').forEach(function (x) {
            x.classList.remove('active');
          });
          el.classList.add('active');
          state.provider = el.dataset.provider;
          showTypeToggle();
        });
      });
    }

    function showTypeToggle() {
      const prov = state.products.providers.find(function (p) {
        return p.provider === state.provider;
      });
      if (!prov) return;

      const hasPre  = prov.products.some(function (p) { return p.bill_type === 'prepaid'; });
      const hasPost = prov.products.some(function (p) { return p.bill_type === 'postpaid'; });

      $('typeCard').classList.remove('elec-hidden');

      const btns = $('typeToggle').querySelectorAll('button');
      btns.forEach(function (b) {
        const t = b.dataset.type;
        const show = (t === 'prepaid' && hasPre) || (t === 'postpaid' && hasPost);
        b.style.display = show ? 'block' : 'none';
      });

      setBillType(hasPre ? 'prepaid' : 'postpaid');
    }

    function setBillType(t) {
      state.billType = t;
      document.querySelectorAll('#typeToggle button').forEach(function (b) {
        b.classList.toggle('on', b.dataset.type === t);
      });

      const prov = state.products.providers.find(function (p) {
        return p.provider === state.provider;
      });
      const prod = prov.products.find(function (p) { return p.bill_type === t; });
      state.productName = prod ? prod.product_name : null;

      $('btnContinue').disabled = !state.productName;
    }

    document.querySelectorAll('#typeToggle button').forEach(function (b) {
      b.addEventListener('click', function () { setBillType(b.dataset.type); });
    });

    $('btnContinue').addEventListener('click', function () {
      showStep(2);
      setTimeout(function () { $('meter').focus(); }, 200);
    });

    $('btnBack2').addEventListener('click', function () { showStep(1); });
    $('btnBack3').addEventListener('click', function () { showStep(2); });

    /* ============================================================
       STEP 2 — Meter input
       ============================================================ */
    $('meter').addEventListener('input', function (e) {
      e.target.value = e.target.value.replace(/\D/g, '').slice(0, 13);
      state.meterNumber = e.target.value;
      $('btnVerify').disabled = state.meterNumber.length < 11;
      $('verifiedBox').classList.add('elec-hidden');
      $('amountCard').classList.add('elec-hidden');
      $('btnPay').classList.add('elec-hidden');
      $('verifyMsg').innerHTML = '';
    });

    /* ---------- Verify meter ---------- */
    $('btnVerify').addEventListener('click', async function () {
      $('verifyMsg').innerHTML =
        '<div class="elec-alert ok"><span class="elec-spinner"></span>Verifying meter…</div>';
      $('btnVerify').disabled = true;

      try {
        const v = await callApi('/verify', {
          method: 'POST',
          body: { product_name: state.productName, meter_number: state.meterNumber },
        });
        state.verified = v;

        $('vName').textContent = v.customer_name || 'Verified';
        const addrLine = [v.customer_address, v.district, v.business_unit]
          .filter(Boolean).join(' · ');
        $('vAddr').textContent  = addrLine || '';
        $('vDisco').textContent = v.disco || v.service_name || v.provider || '';
        $('verifiedBox').classList.remove('elec-hidden');

        let msg = '<div class="elec-alert ok">✓ Meter verified</div>';
        if (v.customer_arrears > 0) {
          msg += '<div class="elec-alert warn" style="margin-top:8px">⚠ Outstanding arrears: '
               + fmt(v.customer_arrears) + '</div>';
        }
        $('verifyMsg').innerHTML = msg;

        $('amountCard').classList.remove('elec-hidden');
        $('btnPay').classList.remove('elec-hidden');

        const min = v.minimum_amount || 1000;
        const max = v.maximum_amount || 200000;
        $('amountMsg').textContent = 'Minimum ' + fmt(min) + ' · Maximum ' + fmt(max);
        $('amount').placeholder = String(min);
      } catch (err) {
        $('verifyMsg').innerHTML = '<div class="elec-alert err">' + err.message + '</div>';
      } finally {
        $('btnVerify').disabled = false;
      }
    });

    /* ---------- Amount input ---------- */
    $('amount').addEventListener('input', function (e) {
      e.target.value = e.target.value.replace(/\D/g, '');
      state.amount = Number(e.target.value) || 0;
      document.querySelectorAll('#chips .elec-chip').forEach(function (c) {
        c.classList.toggle('active', Number(c.dataset.amt) === state.amount);
      });
      validateAmount();
    });

    document.querySelectorAll('#chips .elec-chip').forEach(function (c) {
      c.addEventListener('click', function () {
        $('amount').value = c.dataset.amt;
        state.amount = Number(c.dataset.amt);
        document.querySelectorAll('#chips .elec-chip').forEach(function (x) {
          x.classList.toggle('active', x === c);
        });
        validateAmount();
      });
    });

    function validateAmount() {
      const v = state.verified;
      if (!v) return;
      const min = v.minimum_amount || 1000;
      const max = v.maximum_amount || 200000;
      const a   = state.amount || 0;

      if (!a) { $('btnPay').disabled = true; return; }
      if (a < min) {
        $('amountMsg').textContent = 'Minimum is ' + fmt(min);
        $('btnPay').disabled = true;
        return;
      }
      if (a > max) {
        $('amountMsg').textContent = 'Maximum is ' + fmt(max);
        $('btnPay').disabled = true;
        return;
      }
      $('amountMsg').textContent = 'You will pay ' + fmt(a);
      $('btnPay').disabled = false;
    }

    $('btnPay').addEventListener('click', function () {
      const v = state.verified;
      $('cDisco').textContent  = v.disco || v.service_name || v.provider || '—';
      $('cType').textContent   = v.bill_type || '—';
      $('cMeter').textContent  = v.meter_number || '—';
      $('cName').textContent   = v.customer_name || '—';
      $('cAmount').textContent = fmt(state.amount);
      $('cPay').textContent    = fmt(state.amount);
      showStep(3);
    });

    /* ============================================================
       STEP 3 — Purchase
       ============================================================ */
    $('btnConfirm').addEventListener('click', async function () {
      $('btnConfirm').disabled = true;
      $('payMsg').innerHTML =
        '<div class="elec-alert ok"><span class="elec-spinner"></span>Processing payment…</div>';

      try {
        const r = await callApi('/purchase', {
          method: 'POST',
          body: {
            product_name:   state.productName,
            meter_number:   state.meterNumber,
            amount:         state.amount,
            payment_method: 'wallet',
          },
        });

        state.reference = r.reference;

        if (r.status === 'success') {
          renderSuccess(r);
        } else if (r.status === 'processing') {
          renderProcessing(r);
        } else {
          renderFailure(r);
        }
      } catch (err) {
        $('payMsg').innerHTML = '';
        renderFailure({ remark: err.message, reference: null });
      } finally {
        $('btnConfirm').disabled = false;
      }
    });

    /* ============================================================
       STEP 4 — Result renderers
       ============================================================ */
    function renderSuccess(r) {
      showStep(4);
      const tokenBlock = r.token
        ? '<div class="elec-tokenbox">' +
            '<div class="tok" id="tokText">' + r.token + '</div>' +
            (r.units ? '<div class="units">' + r.units + ' kWh</div>' : '') +
            '<button class="elec-copy" id="copyTok">Copy token</button>' +
          '</div>'
        : '';

      $('resultCard').innerHTML =
        '<div class="elec-alert ok" style="font-size:15px;font-weight:800;text-align:center;">✓ Payment successful</div>' +
        '<div style="margin-top:14px;text-align:left;">' +
          '<div class="elec-kv"><span class="k">Disco</span><span class="v">' + (r.disco || r.provider || '') + '</span></div>' +
          '<div class="elec-kv"><span class="k">Meter</span><span class="v">' + (r.meter_number || '') + '</span></div>' +
          '<div class="elec-kv"><span class="k">Customer</span><span class="v">' + (r.customer_name || '—') + '</span></div>' +
          '<div class="elec-kv"><span class="k">Amount</span><span class="v">' + fmt(r.amount) + '</span></div>' +
          '<div class="elec-kv"><span class="k">Reference</span><span class="v" style="font-size:11px;">' + r.reference + '</span></div>' +
        '</div>' +
        tokenBlock;

      if (r.token) {
        const btn = $('copyTok');
        if (btn) {
          btn.addEventListener('click', function () {
            try {
              navigator.clipboard.writeText(r.token);
              btn.textContent = 'Copied ✓';
            } catch (_) {
              prompt('Copy your token:', r.token);
            }
          });
        }
      }
    }

    function renderProcessing(r) {
      showStep(4);
      $('resultCard').innerHTML =
        '<div class="elec-alert warn" style="font-weight:800;font-size:14px;">⏳ Confirming with provider</div>' +
        '<p class="elec-muted" style="margin:12px 0;">This is taking a bit longer than usual. We\'ll update this screen automatically.</p>' +
        '<div class="elec-kv"><span class="k">Reference</span><span class="v" style="font-size:11px;">' + r.reference + '</span></div>' +
        '<div class="elec-kv"><span class="k">Status</span><span class="v" id="pollStatus">processing</span></div>';
      pollStatus(r.reference);
    }

    function renderFailure(r) {
      showStep(4);
      $('resultCard').innerHTML =
        '<div class="elec-alert err" style="font-weight:800;font-size:14px;">✕ Payment failed</div>' +
        '<p class="elec-muted" style="margin:12px 0;">' + (r.remark || 'Please try again.') + '</p>' +
        (r.reference
          ? '<div class="elec-kv"><span class="k">Reference</span><span class="v" style="font-size:11px;">' + r.reference + '</span></div>'
          : '');
    }

    function pollStatus(reference) {
      if (state.pollTimer) clearInterval(state.pollTimer);
      let attempts = 0;
      const MAX = 60; // ~5 minutes at 5s interval

      state.pollTimer = setInterval(async function () {
        attempts++;
        if (attempts > MAX) { clearInterval(state.pollTimer); return; }

        try {
          const s = await callApi('/status?reference=' + encodeURIComponent(reference));
          const el = $('pollStatus');
          if (el) el.textContent = s.status;

          if (s.status === 'success') {
            clearInterval(state.pollTimer);
            renderSuccess(Object.assign({}, s, { reference: reference }));
          } else if (s.status === 'failed') {
            clearInterval(state.pollTimer);
            renderFailure(Object.assign({}, s, { reference: reference }));
          }
        } catch (err) {
          console.warn('[electricity] poll error:', err.message);
        }
      }, 5000);
    }

    /* ============================================================
       Reset
       ============================================================ */
    $('btnNew').addEventListener('click', function () {
      if (state.pollTimer) clearInterval(state.pollTimer);
      state.provider = null;
      state.billType = null;
      state.productName = null;
      state.meterNumber = '';
      state.verified = null;
      state.amount = null;
      state.reference = null;
      state.pollTimer = null;

      $('meter').value = '';
      $('amount').value = '';
      $('verifiedBox').classList.add('elec-hidden');
      $('amountCard').classList.add('elec-hidden');
      $('btnPay').classList.add('elec-hidden');
      $('btnVerify').disabled = true;
      $('verifyMsg').innerHTML = '';
      $('payMsg').innerHTML = '';
      $('amountMsg').textContent = '';

      document.querySelectorAll('.elec-disco').forEach(function (x) {
        x.classList.remove('active');
      });
      document.querySelectorAll('#chips .elec-chip').forEach(function (x) {
        x.classList.remove('active');
      });

      $('typeCard').classList.add('elec-hidden');
      $('btnContinue').disabled = true;
      showStep(1);
    });

    /* ============================================================
       Boot
       ============================================================ */
    loadProducts();
  })();
  </script>
</body>
</html>
