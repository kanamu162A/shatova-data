  <!-- Ultimate kill switch — removes any fade element that appears -->
  <style>
    .page-fadeout,
    .top-loader,
    .nav-fade,
    .page-transition,
    .fade-overlay,
    [class*="page-fade"],
    [class*="page-transition"] {
      display: none !important;
      opacity: 0 !important;
      visibility: hidden !important;
      pointer-events: none !important;
      animation: none !important;
      transition: none !important;
    }
  </style>

  <script>
    (function () {
      var SELECTORS = '.page-fadeout,.top-loader,.nav-fade,.page-transition,.fade-overlay';
      function kill() {
        try {
          document.querySelectorAll(SELECTORS).forEach(function (el) { el.remove(); });
        } catch (e) {}
      }
      kill();
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', kill, { once: true });
      }
      try {
        new MutationObserver(kill).observe(document.documentElement, {
          childList: true, subtree: true
        });
      } catch (e) {}
      window.__NO_FADE__ = true;
    })();
  </script>

  <script src="/js/api.js"></script>

  <script>
    (function () {
      'use strict';

      var API_BASE = '/api/v1';
      var $ = function (s) { return document.querySelector(s); };

      var ADMIN_ROLES = ['admin', 'super_admin', 'superadmin', 'owner'];

      function getToken() {
        return localStorage.getItem('token') || sessionStorage.getItem('token');
      }

      function authHeaders() {
        var t = getToken();
        return Object.assign(
          { 'Content-Type': 'application/json' },
          t ? { Authorization: 'Bearer ' + t } : {}
        );
      }

      /* ============================================================
         ADMIN DETECTION — decode JWT payload client-side
         ============================================================ */
      function decodeJwt(token) {
        try {
          var base64 = token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
          var padded = base64 + '='.repeat((4 - base64.length % 4) % 4);
          return JSON.parse(decodeURIComponent(escape(atob(padded))));
        } catch (e) {
          return null;
        }
      }

      function isAdminUser() {
        var token = getToken();
        if (!token) return false;
        var payload = decodeJwt(token);
        if (!payload) return false;
        var role = String(payload.role || '').toLowerCase();
        return ADMIN_ROLES.indexOf(role) !== -1;
      }

      function revealAdminSection() {
        if (!isAdminUser()) return;
        var section = document.getElementById('adminSection');
        if (section) section.hidden = false;
      }

      /* Also check role on the fetched user object (belt and braces) */
      function revealAdminFromUser(user) {
        if (!user) return;
        var role = String(user.role || '').toLowerCase();
        if (ADMIN_ROLES.indexOf(role) !== -1) {
          var section = document.getElementById('adminSection');
          if (section) section.hidden = false;
        }
      }

      // 1) Immediate: JWT check
      revealAdminSection();

      /* ============================================================
         NAV ITEM LOADING
         ============================================================ */
      function wireNavLoading(el) {
        if (!el || el.dataset.wired === '1') return;
        el.dataset.wired = '1';

        el.addEventListener('click', function (e) {
          if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;

          var href = el.getAttribute('href');
          if (!href || href === '#') return;
          if (/^https?:/i.test(href)) return;

          if (el.classList.contains('is-loading')) {
            e.preventDefault();
            return;
          }

          e.preventDefault();
          el.classList.add('is-loading');
          el.setAttribute('aria-busy', 'true');

          setTimeout(function () {
            window.location.href = href;
          }, 420);
        });
      }

      /* Highlight current page + wire every nav item (including admin) */
      var path = location.pathname.toLowerCase();
      document.querySelectorAll('.menu-nav-item').forEach(function (el) {
        var key = el.dataset.page;
        if (
          (key === 'home' && (path.includes('home') || path === '/')) ||
          (key === 'activity' && path.includes('transaction')) ||
          (key === 'settings' && path.includes('settings')) ||
          (key === 'support' && path.includes('support')) ||
          (key === 'profile' && path.includes('profile')) ||
          (key === 'admin' && path.includes('admin'))
        ) el.classList.add('active');

        wireNavLoading(el);
      });

      /* User card loading */
      var userCard = document.querySelector('.menu-user-card');
      if (userCard) wireNavLoading(userCard);

      /* Close buttons */
      function goBack() {
        if (history.length > 1) history.back();
        else location.href = '/home.html';
      }
      var closeBtn = $('#menuClose');
      if (closeBtn) closeBtn.addEventListener('click', goBack);
      var closeBtn2 = $('#menuClose2');
      if (closeBtn2) closeBtn2.addEventListener('click', goBack);

      /* ============================================================
         PAINT USER INFO
         ============================================================ */
      function paintUser(user) {
        if (!user) return;
        var fullName =
          [user.first_name, user.last_name].filter(Boolean).join(' ') ||
          user.full_name || user.name || user.username || 'Shatova User';

        var rawPhone = user.phone || user.phone_number || '';
        var digits = String(rawPhone).replace(/\D/g, '');
        var masked = '—';
        if (digits.length >= 7) masked = digits.slice(0, 4) + '****' + digits.slice(-3);
        else if (digits.length) masked = digits;

        var balance = Number(
          user.balance ??
          (user.wallet && user.wallet.balance) ??
          user.wallet_balance ?? 0
        );

        var nameEl = $('#mucName');
        var phoneEl = $('#mucPhone');
        var avatarEl = $('#mucAvatar');
        var walletEl = $('#mucWallet');

        if (nameEl) nameEl.textContent = fullName;
        if (phoneEl) phoneEl.textContent = masked;
        if (avatarEl) avatarEl.textContent = (fullName.charAt(0) || 'S').toUpperCase();
        if (walletEl) walletEl.textContent = '₦' + balance.toLocaleString('en-NG', {
          minimumFractionDigits: 2, maximumFractionDigits: 2
        });

        /* Also try to reveal admin section from user data */
        revealAdminFromUser(user);
      }

      try {
        var store = localStorage.getItem('token') ? localStorage : sessionStorage;
        var cached = JSON.parse(store.getItem('user') || 'null');
        if (cached) paintUser(cached);
      } catch (e) {}

      fetch(API_BASE + '/auth/me', { headers: authHeaders() })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (json) {
          if (!json) return;
          var user = (json.data && json.data.user) || json.user || json.data;
          if (!user) return;
          paintUser(user);
          try {
            var s = localStorage.getItem('token') ? localStorage : sessionStorage;
            s.setItem('user', JSON.stringify(user));
          } catch (e) {}
        })
        .catch(function () {});

      /* ============================================================
         LOGOUT — full wipe
         ============================================================ */
      function wipeAll() {
        var keys = [
          'token', 'user',
          'pinVerified', 'pin_verified', 'pinToken', 'pin_token',
          'pin', 'user_pin', 'shatova_pin',
          'shatova_token', 'auth_token', 'access_token', 'refresh_token',
          'lastPath', 'pinAttempts', 'pin_attempts'
        ];
        try {
          keys.forEach(function (k) {
            try { localStorage.removeItem(k); } catch (e) {}
            try { sessionStorage.removeItem(k); } catch (e) {}
          });
        } catch (e) {}
        try { localStorage.clear(); } catch (e) {}
        try { sessionStorage.clear(); } catch (e) {}

        try {
          var cookies = document.cookie ? document.cookie.split(';') : [];
          for (var i = 0; i < cookies.length; i++) {
            var c = cookies[i];
            var eq = c.indexOf('=');
            var name = eq > -1 ? c.substr(0, eq).trim() : c.trim();
            if (!name) continue;
            var expire = 'expires=Thu, 01 Jan 1970 00:00:00 GMT';
            document.cookie = name + '=;' + expire + ';path=/';
            document.cookie = name + '=;' + expire + ';path=/;domain=' + location.hostname;
            document.cookie = name + '=;' + expire + ';path=/;domain=.' + location.hostname;
          }
        } catch (e) {}
      }

      function wipeIdb() {
        return new Promise(function (resolve) {
          try {
            if (!('indexedDB' in window)) return resolve();
            if (typeof indexedDB.databases !== 'function') return resolve();
            indexedDB.databases().then(function (dbs) {
              Promise.all(dbs.map(function (db) {
                if (!db || !db.name) return;
                return new Promise(function (res) {
                  var req = indexedDB.deleteDatabase(db.name);
                  req.onsuccess = req.onerror = req.onblocked = function () { res(); };
                });
              })).then(resolve, resolve);
            }).catch(resolve);
          } catch (e) { resolve(); }
        });
      }

      function wipeSw() {
        return new Promise(function (resolve) {
          try {
            if (!('serviceWorker' in navigator)) return resolve();
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              Promise.all(regs.map(function (r) { return r.unregister().catch(function () {}); }))
                .then(function () {
                  if ('caches' in window) {
                    caches.keys().then(function (keys) {
                      Promise.all(keys.map(function (k) { return caches.delete(k).catch(function () {}); }))
                        .then(resolve, resolve);
                    }).catch(resolve);
                  } else resolve();
                }).catch(resolve);
            }).catch(resolve);
          } catch (e) { resolve(); }
        });
      }

      function tellBackend() {
        var token = getToken();
        var eps = ['/auth/pin-logout', '/auth/logout', '/auth/pin/reset'];
        return Promise.all(eps.map(function (ep) {
          return fetch(API_BASE + ep, {
            method: 'POST',
            headers: Object.assign(
              { 'Content-Type': 'application/json' },
              token ? { Authorization: 'Bearer ' + token } : {}
            ),
            credentials: 'include'
          }).catch(function () {});
        }));
      }

      var logoutBtn = $('#menuLogout');
      if (logoutBtn) {
        logoutBtn.addEventListener('click', function () {
          if (!confirm('Log out of Shatova?')) return;

          logoutBtn.disabled = true;
          logoutBtn.innerHTML =
            '<span style="display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid rgba(220,38,38,0.25);border-top-color:#dc2626;animation:menuSpin .65s linear infinite;"></span> Logging out…';

          tellBackend()
            .then(function () { wipeAll(); return Promise.all([wipeIdb(), wipeSw()]); })
            .then(function () {
              location.replace('/login.html?logout=1&t=' + Date.now());
            });
        });
      }
    })();
  </script>

  <style>
    @keyframes menuSpin { to { transform: rotate(360deg); } }
