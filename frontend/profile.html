<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Shatova - Account</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/profile.css">
</head>
<body class="profile">

  <!-- Header slot -->
  <div id="app-header"></div>

  <main class="app-container pr-page">

    <!-- MINIMAL HEAD (back button only) -->
    <div class="pr-page-head">
      <button class="back-btn" onclick="history.back()" aria-label="Back">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/>
        </svg>
      </button>
    </div>

    <div class="pr-step">

      <!-- HERO — avatar + name + email -->
      <section class="pr-hero">
        <div class="pr-avatar-wrap">
          <div class="pr-avatar" id="prAvatar">
            <span id="prInitials">S</span>
          </div>
          <button class="pr-avatar-edit" id="prAvatarEdit" aria-label="Change photo">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/>
              <circle cx="12" cy="13" r="3"/>
            </svg>
          </button>
        </div>

        <h2 class="pr-name" id="prName">Loading…</h2>
        <p class="pr-email" id="prEmail">—</p>
      </section>

      <!-- PERSONAL INFORMATION -->
      <div class="pr-label">Personal Information</div>
      <div class="pr-card">

        <div class="pr-row">
          <div class="pr-row-icon">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
          </div>
          <div class="pr-row-info">
            <div class="pr-row-label">Full Name</div>
            <div class="pr-row-value" id="prFullName">—</div>
          </div>
        </div>

        <div class="pr-row">
          <div class="pr-row-icon">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
          </div>
          <div class="pr-row-info">
            <div class="pr-row-label">Email</div>
            <div class="pr-row-value" id="prRowEmail">—</div>
          </div>
        </div>

        <div class="pr-row">
          <div class="pr-row-icon">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg>
          </div>
          <div class="pr-row-info">
            <div class="pr-row-label">Phone</div>
            <div class="pr-row-value" id="prPhone">—</div>
          </div>
        </div>

        <div class="pr-row">
          <div class="pr-row-icon">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
          </div>
          <div class="pr-row-info">
            <div class="pr-row-label">Date Joined</div>
            <div class="pr-row-value" id="prJoined">—</div>
          </div>
        </div>

        <div class="pr-row">
          <div class="pr-row-icon">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V8a2 2 0 00-2-2h-5m-4 0V5a2 2 0 012-2h2a2 2 0 012 2v1m-6 0h6"/></svg>
          </div>
          <div class="pr-row-info">
            <div class="pr-row-label">User ID</div>
            <div class="pr-row-value pr-mono" id="prUserId">—</div>
          </div>
          <button class="pr-copy" id="prCopyId" aria-label="Copy ID">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/>
            </svg>
          </button>
        </div>

      </div>

      <!-- ACCOUNT -->
      <div class="pr-label">Account</div>
      <div class="pr-card">

        <div class="pr-row">
          <div class="pr-row-icon">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"/></svg>
          </div>
          <div class="pr-row-info">
            <div class="pr-row-label">Wallet Balance</div>
            <div class="pr-row-value pr-balance" id="prBalance">₦ 0.00</div>
          </div>
        </div>

        <div class="pr-row">
          <div class="pr-row-icon">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
          </div>
          <div class="pr-row-info">
            <div class="pr-row-label">Account Status</div>
            <div class="pr-row-value" id="prAccountStatus">—</div>
          </div>
          <span class="pr-status-dot" id="prStatusDot"></span>
        </div>

      </div>

      <!-- ACTIONS -->
      <div class="pr-label">Actions</div>
      <div class="pr-card pr-card-actions">

        <button class="pr-action" id="prEditBtn">
          <div class="pr-action-icon edit">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
          </div>
          <div class="pr-action-info">
            <div class="pr-action-title">Edit Profile</div>
            <div class="pr-action-sub">Update your personal details</div>
          </div>
          <svg class="pr-action-arrow" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"/></svg>
        </button>

        <button class="pr-action" id="prPasswordBtn">
          <div class="pr-action-icon lock">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
          </div>
          <div class="pr-action-info">
            <div class="pr-action-title">Change Password</div>
            <div class="pr-action-sub">Keep your account secure</div>
          </div>
          <svg class="pr-action-arrow" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"/></svg>
        </button>

        <button class="pr-action" id="prSupportBtn">
          <div class="pr-action-icon help">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          </div>
          <div class="pr-action-info">
            <div class="pr-action-title">Help &amp; Support</div>
            <div class="pr-action-sub">Get in touch with our team</div>
          </div>
          <svg class="pr-action-arrow" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"/></svg>
        </button>

        <button class="pr-action danger" id="prLogoutBtn">
          <div class="pr-action-icon danger">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
          </div>
          <div class="pr-action-info">
            <div class="pr-action-title">Log Out</div>
            <div class="pr-action-sub">Sign out of your account</div>
          </div>
          <svg class="pr-action-arrow" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"/></svg>
        </button>

      </div>

      <div class="pr-footer">Shatova · v1.0.0</div>

    </div>
  </main>

  <!-- LOGOUT CONFIRM MODAL -->
  <div id="prLogoutModal" class="pr-modal-backdrop hidden" role="dialog" aria-modal="true">
    <div class="pr-modal">
      <div class="pr-modal-icon danger">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M12 9v2m0 4h.01M5.07 19h13.86a2 2 0 001.74-3L13.74 4a2 2 0 00-3.48 0L3.33 16a2 2 0 001.74 3z"/>
        </svg>
      </div>
      <h3 class="pr-modal-title">Log out?</h3>
      <p class="pr-modal-text">You'll need to sign in again to access your wallet.</p>
      <div class="pr-modal-actions">
        <button class="pr-modal-btn ghost" id="prLogoutCancel">Cancel</button>
        <button class="pr-modal-btn danger" id="prLogoutConfirm">Log Out</button>
      </div>
    </div>
  </div>

  <!-- ═══════════ SCRIPTS — order matters ═══════════ -->
  <!-- 1. auth-guard first: no token → /login.html, no PIN → /pin.html -->
  <script src="/js/auth-guard.js"></script>

  <!-- 2. api base -->
  <script src="/js/api.js"></script>

  <!-- 3. page logic -->
  <script type="module" src="/js/components.js"></script>
  <script type="module" src="/js/profile.js"></script>
</body>
</html>
