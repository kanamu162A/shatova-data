<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Shatova</title>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #fbfcfb;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    .boot {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 18px;
    }
    .boot-mark {
      width: 56px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 16px;
      background: linear-gradient(145deg, #0e5a41, #052b20);
      box-shadow:
        0 10px 24px -8px rgba(10, 69, 52, 0.35),
        inset 0 1px 0 rgba(255, 255, 255, 0.12);
      animation: pulse 1.6s ease-in-out infinite;
    }
    .boot-mark svg { width: 32px; height: 32px; }
    @keyframes pulse {
      0%, 100% { transform: scale(1);    opacity: 1;    }
      50%      { transform: scale(1.06); opacity: 0.85; }
    }
    .boot-text {
      font-size: 13px;
      color: #6b7280;
      font-weight: 500;
      letter-spacing: 0.2px;
    }
  </style>
  <link rel="stylesheet" href="/css/theme.css">

  <script>
    // ============================================================
    // Boot redirect
    //   No token        → /login.html
    //   Token exists    → /pin.html  (PIN gate decides next step)
    //
    // The PIN page will then:
    //   • auto-forward to /home.html if already verified this session
    //   • show verify mode if pin_hash exists on server
    //   • show setup mode if no pin_hash on server yet
    // ============================================================
    (function () {
      var token =
        localStorage.getItem('token') ||
        sessionStorage.getItem('token') ||
        localStorage.getItem('shatova_token') ||
        sessionStorage.getItem('shatova_token');

      if (token) {
        window.location.replace('/pin.html');
      } else {
        window.location.replace('/login.html');
      }
    })();
  </script>
</head>
<body>
  <div class="boot">
    <div class="boot-mark">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2L3 7V12C3 17 7 21 12 22C17 21 21 17 21 12V7L12 2Z" fill="url(#bootGrad)"/>
        <path d="M9 12L11 14L15 10" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <defs>
          <linearGradient id="bootGrad" x1="3" y1="2" x2="21" y2="22" gradientUnits="userSpaceOnUse">
            <stop stop-color="#f5c542"/>
            <stop offset="1" stop-color="#d9a92a"/>
          </linearGradient>
        </defs>
      </svg>
    </div>
    <div class="boot-text">Loading Shatova…</div>
  </div>
</body>
</html>
